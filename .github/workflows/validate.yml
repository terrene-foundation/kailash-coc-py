name: Validate COC Structure
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate structure
        run: |
          set -euo pipefail
          echo "Checking COC structure..."

          # Verify critical directories exist
          test -d .claude/agents && echo "✓ agents/"
          test -d .claude/skills && echo "✓ skills/"
          test -d .claude/rules && echo "✓ rules/"
          test -d .claude/commands && echo "✓ commands/"

          # Multi-CLI USE template MUST emit one baseline per CLI at root
          # (claude → CLAUDE.md, codex → AGENTS.md, gemini → GEMINI.md).
          # Per cross-cli-parity.md MUST Rule 3 (frontmatter priority+scope
          # are identical across CLIs) the three baselines are the always-on
          # surface for each CLI; missing one means that CLI's users get a
          # silently weaker rule surface.
          test -f CLAUDE.md && echo "✓ CLAUDE.md (claude baseline)"
          test -f AGENTS.md && echo "✓ AGENTS.md (codex baseline)"
          test -f GEMINI.md && echo "✓ GEMINI.md (gemini baseline)"

          # Check for contamination: src/kailash/ paths should not leak into
          # USE template .claude/ content EXCEPT for files on the allowlist.
          # Allowlist = files that legitimately guide developers working WITH
          # the kailash-py source tree (provenance, navigation, compliance).
          #
          # See .github/coc-sdk-refs-allowlist.txt to add exemptions.
          # The allowlist is auto-extended by loom's coc-sync agent on every
          # /sync Gate 2 distribute (see loom/.claude/agents/management/
          # coc-sync.md § "Step 7.5: Refresh SDK-Refs Allowlist").
          ALLOWLIST=.github/coc-sdk-refs-allowlist.txt
          if [ ! -f "$ALLOWLIST" ]; then
            echo "ERROR: missing $ALLOWLIST"
            exit 1
          fi

          # Strip comments/blanks from allowlist, sort for comm
          grep -vE '^\s*(#|$)' "$ALLOWLIST" | sort > /tmp/allowed.txt

          # Find all .claude/ files containing src/kailash/
          grep -rl "src/kailash/" .claude/ 2>/dev/null | sort > /tmp/found.txt || true

          # Compute: found \ allowed  (files with contamination not on allowlist)
          contamination=$(comm -23 /tmp/found.txt /tmp/allowed.txt)

          if [ -n "$contamination" ]; then
            echo ""
            echo "ERROR: src/kailash/ references found in files not on allowlist:"
            echo "$contamination" | sed 's/^/  /'
            echo ""
            echo "Fix options:"
            echo "  1. Remove the src/kailash/ reference (if it's an accidental leak), OR"
            echo "  2. Add the file path to $ALLOWLIST (if the file legitimately needs to"
            echo "     reference SDK source — e.g., provenance Origin: lines, compliance"
            echo "     tracking, or navigation skills that teach SDK layout)"
            echo ""
            echo "If this fired during a downstream /sync of a fresh loom release,"
            echo "the upstream coc-sync allowlist auto-refresh did not run. Re-run"
            echo "/sync at loom/ — Step 7.5 will append the new entries."
            exit 1
          fi

          echo "✓ No contamination detected (allowlist: $(wc -l < /tmp/allowed.txt) entries)"

          # Count agents and skills
          echo "Agents: $(find .claude/agents -name '*.md' | wc -l)"
          echo "Skills: $(find .claude/skills -name '*.md' | wc -l)"
          echo "Rules: $(find .claude/rules -name '*.md' | wc -l)"
          echo "Commands: $(find .claude/commands -name '*.md' | wc -l)"
          echo "All checks passed!"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Image-pin MUTUAL-CONSISTENCY gate.
      #
      # TWO DIFFERENT INVARIANTS LIVE HERE. The first version of this step
      # conflated them and was WRONG — it red the 1.22.0 sync PR (#83), which was
      # a correct, intended state. Read this before changing the check:
      #
      #   A. The six pins agree WITH EACH OTHER.  TRUE ALWAYS.  <-- enforced here
      #      This is the failure the brief actually names: "a release that bumps
      #      only the other five silently republishes a stale page", because the
      #      publish workflow pushes DOCKERHUB.md to the registry overview.
      #
      #   B. The six equal .claude/VERSION.  TRUE ONLY AT/AFTER RELEASE.
      #      FALSE BY DESIGN in the sync→release window: loom's Gate-2 sync bumps
      #      VERSION, and the six are repointed later by a local release commit,
      #      once the image for that tag actually EXISTS on the registry. You
      #      cannot point a config at an unpublished image.
      #      Evidence: 537ab6f (2026-08-02) bumped VERSION to 1.21.0; af3eeff
      #      (2026-08-04, two days later) bumped exactly these six together —
      #      "release(dev-image): point consumer configs at the published 1.21.0
      #      image". That two-day gap is the normal window, not drift.
      #
      # B's real enforcement point is TAG TIME — publish-dev-image.yml, which
      # triggers on `push: tags: v*` and is the moment an image is cut. This
      # workflow runs only on push/PR to main and never sees a tag, so it cannot
      # enforce B even in principle. publish-dev-image.yml is loom-synced ("do not
      # hand-edit the consumer copy"), so wiring B there is an UPSTREAM ask.
      #
      # B is therefore reported ADVISORY below — visible, never blocking.
      #
      # Matcher is anchored on `kailash-coc-py:<semver>` deliberately. DOCKERHUB.md
      # carries a bare `1.10.1` in a "Prior stable — retained for provenance" table
      # cell; that is BY DESIGN and is not in the pinned-tag form, so this check
      # structurally cannot trip on it. Do not loosen the anchor to bare versions.
      - name: Image-pin mutual consistency (the six agree with each other)
        run: |
          set -uo pipefail
          # NOT `require("./.claude/VERSION")` — the file is JSON with NO extension,
          # so require() parses it as JS and throws.
          VERSION="$(node -e 'console.log(JSON.parse(require("fs").readFileSync(".claude/VERSION","utf8")).version)')"
          if [ -z "$VERSION" ]; then
            echo "  could not read .claude/VERSION::version — failing rather than comparing against empty"
            exit 1
          fi
          echo "VERSION::version = $VERSION (advisory reference only — see invariant B above)"
          FILES=(docker-compose.yml .devcontainer/devcontainer.json bin/dev
                 README.md Dockerfile.user.example DOCKERHUB.md)
          rc=0
          seen=""
          for f in "${FILES[@]}"; do
            if [ ! -e "$f" ]; then
              echo "  MISSING  $f — the brief names it as one of the six"; rc=1; continue
            fi
            vals="$(grep -oE 'kailash-coc-py:[0-9]+\.[0-9]+\.[0-9]+' "$f" | sed 's/.*://' | sort -u)"
            if [ -z "$vals" ]; then
              echo "  NO PIN   $f — carries no kailash-coc-py:<semver> reference"; rc=1; continue
            fi
            n="$(echo "$vals" | wc -l | tr -d ' ')"
            if [ "$n" -ne 1 ]; then
              echo "  SPLIT    $f disagrees with ITSELF: $(echo "$vals" | tr '\n' ' ')"; rc=1; continue
            fi
            echo "  ok       $f -> $vals"
            seen="$seen$vals"$'\n'
          done

          # INVARIANT A — the blocking one.
          distinct="$(printf '%s' "$seen" | grep -v '^$' | sort -u)"
          count="$(printf '%s\n' "$distinct" | grep -vc '^$' || true)"
          if [ "$count" -gt 1 ]; then
            echo ""
            echo "  INCONSISTENT — the six do not agree: $(printf '%s' "$distinct" | tr '\n' ' ')"
            echo "  This is the failure the brief names: bumping only some of them"
            echo "  republishes a stale Docker Hub overview page. Bump ALL six together."
            rc=1
          elif [ "$rc" -eq 0 ]; then
            echo ""
            echo "  CONSISTENT — all six at $distinct"
            # INVARIANT B — advisory ONLY. Never sets rc.
            if [ "$distinct" != "$VERSION" ]; then
              echo "  note: pins ($distinct) lag VERSION ($VERSION). EXPECTED between a loom"
              echo "        sync and the release commit that repoints them once the image for"
              echo "        $VERSION is published. NOT drift, and deliberately not blocking."
            fi
          fi
          exit "$rc"

      # Cross-reference integrity — EVIDENCE-PRODUCING, NOT A GATE.
      #
      # `continue-on-error: true` is deliberate and load-bearing. The validator
      # exits 1 on ANY dangling ref, and the standing backlog is dominated by
      # by-design artifact (a USE template legitimately has no journal/ tree, so
      # every journal-anchored ref reads as dangling). Wiring this as a blocking
      # gate would red the board permanently on refs that are correct, which is
      # the fastest way to train readers to ignore CI entirely.
      #
      # ONE invocation. Until 2026-08-14 this ran twice, because the validator's
      # DEFAULT_SCOPE_DIRS excluded .claude/guides and that tree had never been
      # scanned by any instrument here. loom's guides-scope fix added it, so the
      # default run now covers guides and a second --scope run would double-count
      # a subset. Do not re-add one.
      #
      # RATCHET: fails ONLY on a count EXCEEDING the pinned baseline — never on
      # the standing backlog, which is why it can have teeth without reding the
      # board.
      #
      # BASELINE IS A RESIDUAL, NOT A CLEARANCE (completion-criterion.md MUST-6):
      #   accepted_by:       repo operator, in-session 2026-08-10; re-pinned
      #                      2026-08-14 for the scope change (see run block)
      #   revisit_trigger:   loom lands the remaining guides path fixes. Partly
      #                      FIRED already — guides not-found fell 22 -> 9 in the
      #                      1.22.0 sync; 9 remain.
      #   calendar_backstop: 2026-11-10 (90d) — re-derive then even if the
      #                      trigger never fires again
      #
      # Lower the baseline the moment further fixes land. A baseline that is
      # never lowered is how a ratchet becomes a rubber stamp. But a baseline
      # moved for a SCOPE change is neither a lowering nor a raise — re-derive
      # from scratch and say so, as the 2026-08-14 re-pin does.
      #
      # NOTE branch protection carries no required_status_checks, so a red here
      # is a loud signal, not a merge block. That is the intended strength.
      - name: Cross-reference integrity (ratchet — fails only on regression)
        run: |
          set -uo pipefail
          # RE-BASELINED 2026-08-14 for a SCOPE CHANGE, not an improvement.
          # loom's guides-scope fix added ".claude/guides" to the validator's
          # DEFAULT_SCOPE_DIRS, so the default run now ABSORBS the guides tree
          # and the old two-baseline split (294 default + 48 guides) no longer
          # measures two disjoint sets — the second run became a SUBSET of the
          # first. Both old numbers are void; comparing against them is
          # meaningless in either direction.
          #
          # What actually moved, separated from the scope shift:
          #   default journal-dir-missing 105 -> 131  (+26 = exactly the guides
          #     tree's own 26, i.e. absorbed, not new rot)
          #   default not-found           189 -> 186  (-3,  real improvement)
          #   guides  not-found            22 -> 9    (-13, loom's fixes landing)
          # The raw +23 on the default scope was the absorption; the underlying
          # not-found surface IMPROVED.
          #
          # Now ONE scope, ONE baseline. Do not re-add a guides sub-run: it
          # double-counts a subset. Still not a health metric — 131 of 317 are
          # by-design journal-dir-missing on a USE template.
          BASELINE_DEFAULT=317
          echo "Cross-reference integrity — ratchet against a pinned baseline."
          echo "NOT a health metric: 131 of the standing total are by-design"
          echo "(journal-dir-missing on a USE template, which has no journal/ tree)."
          echo "Baseline: default=$BASELINE_DEFAULT (now INCLUDES .claude/guides)"
          echo ""

          summarize() {
            local label="$1"; shift
            COUNT=UNMEASURED
            node .claude/bin/validate-xref-integrity.mjs "$@" --json > /tmp/xref.json 2>/tmp/xref.err || true
            if [ ! -s /tmp/xref.json ]; then
              echo "  $label: validator produced no JSON — treat as UNMEASURED, not zero"
              sed 's/^/    /' /tmp/xref.err | head -5
              return
            fi
            COUNT="$(node -e '
              try {
                const d = JSON.parse(require("fs").readFileSync("/tmp/xref.json", "utf8"));
                process.stdout.write(Number.isInteger(d.dangling_count) ? String(d.dangling_count) : "UNMEASURED");
              } catch (e) { process.stdout.write("UNMEASURED"); }
            ')"
            node -e '
              const fs = require("fs");
              const label = process.argv[1];
              let d;
              try { d = JSON.parse(fs.readFileSync("/tmp/xref.json", "utf8")); }
              catch (e) { console.log(`  ${label}: unparseable JSON — UNMEASURED`); process.exit(0); }
              const by = {};
              for (const x of d.dangling || []) {
                const r = x.reason || x.kind || "unknown";
                by[r] = (by[r] || 0) + 1;
              }
              const hosts = new Set((d.dangling || []).map(x => x.source || x.host || "?"));
              console.log(`  ${label}: dangling=${d.dangling_count} across ${hosts.size} host file(s)`);
              console.log(`    files_scanned=${d.files_scanned} tokens_scanned=${d.tokens_scanned}`);
              for (const [r, n] of Object.entries(by).sort((a, b) => b[1] - a[1])) {
                console.log(`    ${r}: ${n}`);
              }
            ' "$label"
          }

          summarize "default scope (commands, rules, skills, agents, guides)"
          DEFAULT_COUNT="$COUNT"

          echo ""
          rc=0
          check() {
            local label="$1" actual="$2" baseline="$3"
            if [ "$actual" = "UNMEASURED" ]; then
              echo "  $label: UNMEASURED — treating as FAILURE, not as zero."
              echo "    An absent measurement is not a passing measurement."
              rc=1
            elif [ "$actual" -gt "$baseline" ]; then
              echo "  $label: REGRESSION — $actual > baseline $baseline (+$((actual - baseline)))"
              rc=1
            elif [ "$actual" -lt "$baseline" ]; then
              echo "  $label: IMPROVED — $actual < baseline $baseline. Lower the baseline in this file."
            else
              echo "  $label: at baseline ($actual)."
            fi
          }
          check "default scope" "$DEFAULT_COUNT" "$BASELINE_DEFAULT"

          if [ "$rc" -ne 0 ]; then
            echo ""
            echo "New dangling cross-references, or a measurement that did not run."
            echo "Fix the new refs — do NOT raise the baseline to make this pass."
          fi
          exit "$rc"
