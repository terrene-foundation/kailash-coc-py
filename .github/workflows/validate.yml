name: Validate COC Structure
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate structure
        run: |
          set -euo pipefail
          echo "Checking COC structure..."

          # Verify critical directories exist
          test -d .claude/agents && echo "✓ agents/"
          test -d .claude/skills && echo "✓ skills/"
          test -d .claude/rules && echo "✓ rules/"
          test -d .claude/commands && echo "✓ commands/"

          # Multi-CLI USE template MUST emit one baseline per CLI at root
          # (claude → CLAUDE.md, codex → AGENTS.md, gemini → GEMINI.md).
          # Per cross-cli-parity.md MUST Rule 3 (frontmatter priority+scope
          # are identical across CLIs) the three baselines are the always-on
          # surface for each CLI; missing one means that CLI's users get a
          # silently weaker rule surface.
          test -f CLAUDE.md && echo "✓ CLAUDE.md (claude baseline)"
          test -f AGENTS.md && echo "✓ AGENTS.md (codex baseline)"
          test -f GEMINI.md && echo "✓ GEMINI.md (gemini baseline)"

          # Check for contamination: src/kailash/ paths should not leak into
          # USE template .claude/ content EXCEPT for files on the allowlist.
          # Allowlist = files that legitimately guide developers working WITH
          # the kailash-py source tree (provenance, navigation, compliance).
          #
          # See .github/coc-sdk-refs-allowlist.txt to add exemptions.
          # The allowlist is auto-extended by loom's coc-sync agent on every
          # /sync Gate 2 distribute (see loom/.claude/agents/management/
          # coc-sync.md § "Step 7.5: Refresh SDK-Refs Allowlist").
          ALLOWLIST=.github/coc-sdk-refs-allowlist.txt
          if [ ! -f "$ALLOWLIST" ]; then
            echo "ERROR: missing $ALLOWLIST"
            exit 1
          fi

          # Strip comments/blanks from allowlist, sort for comm
          grep -vE '^\s*(#|$)' "$ALLOWLIST" | sort > /tmp/allowed.txt

          # Find all .claude/ files containing src/kailash/
          grep -rl "src/kailash/" .claude/ 2>/dev/null | sort > /tmp/found.txt || true

          # Compute: found \ allowed  (files with contamination not on allowlist)
          contamination=$(comm -23 /tmp/found.txt /tmp/allowed.txt)

          if [ -n "$contamination" ]; then
            echo ""
            echo "ERROR: src/kailash/ references found in files not on allowlist:"
            echo "$contamination" | sed 's/^/  /'
            echo ""
            echo "Fix options:"
            echo "  1. Remove the src/kailash/ reference (if it's an accidental leak), OR"
            echo "  2. Add the file path to $ALLOWLIST (if the file legitimately needs to"
            echo "     reference SDK source — e.g., provenance Origin: lines, compliance"
            echo "     tracking, or navigation skills that teach SDK layout)"
            echo ""
            echo "If this fired during a downstream /sync of a fresh loom release,"
            echo "the upstream coc-sync allowlist auto-refresh did not run. Re-run"
            echo "/sync at loom/ — Step 7.5 will append the new entries."
            exit 1
          fi

          echo "✓ No contamination detected (allowlist: $(wc -l < /tmp/allowed.txt) entries)"

          # Count agents and skills
          echo "Agents: $(find .claude/agents -name '*.md' | wc -l)"
          echo "Skills: $(find .claude/skills -name '*.md' | wc -l)"
          echo "Rules: $(find .claude/rules -name '*.md' | wc -l)"
          echo "Commands: $(find .claude/commands -name '*.md' | wc -l)"
          echo "All checks passed!"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Image-pin drift gate. workspaces/dev-container/briefs/00-user-brief.md
      # § Post-pivot declares: "SIX consumer-shipped files reference the same tag
      # and MUST all be bumped together", and names the failure — the publish
      # workflow's "Sync Docker Hub overview" step pushes DOCKERHUB.md to the
      # registry page, so a release that bumps only five silently republishes a
      # stale page. That MUST had no enforcement until now.
      #
      # HARD gate, not advisory: the correct state is currently green (all six at
      # VERSION), so this reds only on real drift. That is what distinguishes it
      # from the xref check below, whose standing backlog forces a ratchet.
      #
      # Matcher is anchored on `kailash-coc-py:<semver>` deliberately. DOCKERHUB.md
      # carries a bare `1.10.1` in a "Prior stable — retained for provenance" table
      # cell; that is BY DESIGN and is not in the pinned-tag form, so this check
      # structurally cannot trip on it. Do not loosen the anchor to bare versions.
      - name: Image-pin drift (six consumer-shipped files vs .claude/VERSION)
        run: |
          set -uo pipefail
          # NOT `require("./.claude/VERSION")` — the file is JSON with NO extension,
          # so require() parses it as JS and throws. That would leave VERSION empty
          # and red every file on every run: a false-red gate, worse than none.
          VERSION="$(node -e 'console.log(JSON.parse(require("fs").readFileSync(".claude/VERSION","utf8")).version)')"
          if [ -z "$VERSION" ]; then
            echo "  could not read .claude/VERSION::version — failing rather than comparing against empty"
            exit 1
          fi
          echo "VERSION::version = $VERSION"
          FILES=(docker-compose.yml .devcontainer/devcontainer.json bin/dev
                 README.md Dockerfile.user.example DOCKERHUB.md)
          rc=0
          for f in "${FILES[@]}"; do
            if [ ! -e "$f" ]; then
              echo "  MISSING  $f — the brief names it as one of the six"; rc=1; continue
            fi
            hits="$(grep -noE 'kailash-coc-py:[0-9]+\.[0-9]+\.[0-9]+' "$f" || true)"
            if [ -z "$hits" ]; then
              echo "  NO PIN   $f — carries no kailash-coc-py:<semver> reference"; rc=1; continue
            fi
            bad="$(echo "$hits" | grep -v ":kailash-coc-py:${VERSION}\$" || true)"
            if [ -n "$bad" ]; then
              echo "  DRIFT    $f"; echo "$bad" | sed 's/^/             line /'; rc=1
            else
              echo "  ok       $f ($(echo "$hits" | wc -l | tr -d ' ') pin(s) at $VERSION)"
            fi
          done
          if [ "$rc" -ne 0 ]; then
            echo ""
            echo "Image-pin drift. All six files MUST carry the same tag as .claude/VERSION."
            echo "A release that bumps only some of them republishes a stale Docker Hub page."
          fi
          exit "$rc"

      # Cross-reference integrity — EVIDENCE-PRODUCING, NOT A GATE.
      #
      # `continue-on-error: true` is deliberate and load-bearing. The validator
      # exits 1 on ANY dangling ref, and the standing backlog is dominated by
      # by-design artifact (a USE template legitimately has no journal/ tree, so
      # every journal-anchored ref reads as dangling). Wiring this as a blocking
      # gate would red the board permanently on refs that are correct, which is
      # the fastest way to train readers to ignore CI entirely.
      #
      # Two invocations, because DEFAULT_SCOPE_DIRS in the validator does NOT
      # include .claude/guides — that tree had never been scanned by any
      # instrument in this repo until it was measured by hand on 2026-08-10.
      # The --scope flag needs no validator change.
      #
      # DO NOT convert this to a ratchet without pinning the baseline over BOTH
      # scopes, and without classifying the not-found refs first: a baseline is
      # a residual per completion-criterion.md MUST-6 and needs a named
      # acceptor + revisit trigger + calendar backstop. It is a bet, not a
      # clearance. See .claude/.proposals/latest.yaml § s6_6.
      # RATCHET, added after the 22 guides not-found refs were classified
      # (2026-08-10). It fails ONLY on a count that EXCEEDS the pinned baseline
      # — never on the standing backlog, which is why it can have teeth without
      # reding the board.
      #
      # BASELINE IS A RESIDUAL, NOT A CLEARANCE (completion-criterion.md MUST-6):
      #   accepted_by:       repo operator, in-session 2026-08-10
      #   revisit_trigger:   loom lands the guides path fixes (17 of 22 are one
      #                      root cause: model-optimization/04-implementation-plan.md
      #                      cites a FLAT .claude/agents/<name>.md layout that is
      #                      now nested by category)
      #   calendar_backstop: 2026-11-10 (90d) — re-derive both baselines then
      #                      even if the trigger never fires
      #
      # Lower the baselines the moment loom's fixes land. A baseline that is
      # never lowered is how a ratchet becomes a rubber stamp.
      #
      # NOTE branch protection carries no required_status_checks, so a red here
      # is a loud signal, not a merge block. That is the intended strength.
      - name: Cross-reference integrity (ratchet — fails only on regression)
        run: |
          set -uo pipefail
          BASELINE_DEFAULT=294
          BASELINE_GUIDES=48
          echo "Cross-reference integrity — ratchet against pinned baselines."
          echo "Counts are NOT a health metric: much of the standing total is"
          echo "by-design (journal-dir-missing on a USE template, 105 + 26)."
          echo "Baselines: default=$BASELINE_DEFAULT guides=$BASELINE_GUIDES"
          echo ""

          summarize() {
            local label="$1"; shift
            COUNT=UNMEASURED
            node .claude/bin/validate-xref-integrity.mjs "$@" --json > /tmp/xref.json 2>/tmp/xref.err || true
            if [ ! -s /tmp/xref.json ]; then
              echo "  $label: validator produced no JSON — treat as UNMEASURED, not zero"
              sed 's/^/    /' /tmp/xref.err | head -5
              return
            fi
            COUNT="$(node -e '
              try {
                const d = JSON.parse(require("fs").readFileSync("/tmp/xref.json", "utf8"));
                process.stdout.write(Number.isInteger(d.dangling_count) ? String(d.dangling_count) : "UNMEASURED");
              } catch (e) { process.stdout.write("UNMEASURED"); }
            ')"
            node -e '
              const fs = require("fs");
              const label = process.argv[1];
              let d;
              try { d = JSON.parse(fs.readFileSync("/tmp/xref.json", "utf8")); }
              catch (e) { console.log(`  ${label}: unparseable JSON — UNMEASURED`); process.exit(0); }
              const by = {};
              for (const x of d.dangling || []) {
                const r = x.reason || x.kind || "unknown";
                by[r] = (by[r] || 0) + 1;
              }
              const hosts = new Set((d.dangling || []).map(x => x.source || x.host || "?"));
              console.log(`  ${label}: dangling=${d.dangling_count} across ${hosts.size} host file(s)`);
              console.log(`    files_scanned=${d.files_scanned} tokens_scanned=${d.tokens_scanned}`);
              for (const [r, n] of Object.entries(by).sort((a, b) => b[1] - a[1])) {
                console.log(`    ${r}: ${n}`);
              }
            ' "$label"
          }

          summarize "default scope (commands, rules, skills, agents)"
          DEFAULT_COUNT="$COUNT"
          summarize "guides tree (NOT in DEFAULT_SCOPE_DIRS)" --scope .claude/guides
          GUIDES_COUNT="$COUNT"

          echo ""
          rc=0
          check() {
            local label="$1" actual="$2" baseline="$3"
            if [ "$actual" = "UNMEASURED" ]; then
              echo "  $label: UNMEASURED — treating as FAILURE, not as zero."
              echo "    An absent measurement is not a passing measurement."
              rc=1
            elif [ "$actual" -gt "$baseline" ]; then
              echo "  $label: REGRESSION — $actual > baseline $baseline (+$((actual - baseline)))"
              rc=1
            elif [ "$actual" -lt "$baseline" ]; then
              echo "  $label: IMPROVED — $actual < baseline $baseline. Lower the baseline in this file."
            else
              echo "  $label: at baseline ($actual)."
            fi
          }
          check "default scope" "$DEFAULT_COUNT" "$BASELINE_DEFAULT"
          check "guides tree"   "$GUIDES_COUNT"  "$BASELINE_GUIDES"

          if [ "$rc" -ne 0 ]; then
            echo ""
            echo "New dangling cross-references, or a measurement that did not run."
            echo "Fix the new refs — do NOT raise the baseline to make this pass."
          fi
          exit "$rc"
