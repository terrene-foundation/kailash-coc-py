      requested_fix: Scrub citations into excluded trees at emission, or inline the needed content.

    - id: A6
      cluster: A
      status: LANE-REPORTED
      severity: MEDIUM
      where: .codex/skills/rules-reference/SKILL.md and its .gemini twin
      finding: >-
        The rules-reference index -- the non-CC lanes' only path-scoped-rule channel -- advertises
        three rules that use_exclude removes from this template. The exclusion is correct; the
