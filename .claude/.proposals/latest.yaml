        drafts stated a unique-line COUNT and BOTH went stale before this proposal left the repo —
        first "zero" (true when measured, invalidated by a later edit to the file it compares
        against), then "three" (invalidated the same way by the next edit, and by prose reflow). A
        count of a diff between two MUTABLE LOCAL files is not a durable fact and does not belong in
        an upstream artifact; the qualitative claim is what actually survives, and it is what loom
        needs. A reader wanting the current number should MEASURE it, not read it here — and if they
        do: use `LC_ALL=C sort -u` with `comm` plus an IDENTITY control (file vs itself MUST return
