  # ---- Cluster A — emitter completeness (the highest-value cluster) ----------
  # Items 9 and 1 are two MECHANISMS of one failure: an artifact reaches no lane
  # and nothing says so. ONE fail-closed "reaches no lane" assertion closes both,
