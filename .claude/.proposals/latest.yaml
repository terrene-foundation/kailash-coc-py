  known_coverage_gaps: >-
    Stated so this block is not read as a complete audit, and to name specifically what remains after
    the two axes this block closes.

    CLOSED by this block: per-file BODY parity across the co-present skills, rules, commands and
    agents (the previous block recorded this as entirely untested); and container-side hook execution
    (recorded as never exercised).

    ALSO CLOSED, and reported as a CLEAN result rather than a finding: unprefixed relative references
    (paths written WITHOUT the .claude/ prefix -- "rules/foo.md", "skills/<name>/SKILL.md"). An
    earlier draft of this block named that population as the largest remaining gap and predicted the
    same rot found elsewhere. SWEPT and REFUTED: 655 source files, 1560 reference occurrences, 315
    unique paths, 100% of the 97 unresolved unique paths hand-adjudicated by reading prose context.
    Genuinely broken: ONE unique path (2 occurrences) -- a 99% rejection rate on the raw count.
    The reference convention was established empirically before judging anything (1340 of 1560
    unprefixed refs resolve against .claude/), and an exact-case per-segment resolver was used rather
    than a filesystem existence check, which on a case-insensitive filesystem returns true for
    mismatched case. Zero case-mismatch defects exist in this population.

    ALSO CLOSED, and it was NOT clean: section-anchor resolution -- the class this proposal's
    predecessor named as unaudited ("a link may resolve to a real file whose named section is gone").
    Swept: 466 `§` citations across the same 655 files, 100% of the 151 non-resolving cases read
    individually, pass-rate 96.6% reported separately. SIXTEEN genuine broken anchors, filed as
    S3-11. Establishing the conventions first was load-bearing: this corpus anchors on ATX headings,
    bolded bullet clause names, AND bolded lead-ins, and a heading-only model produced ~90 false
    positives before that was discovered.

    STILL OPEN, and it is now the largest unmeasured anchor surface: markdown `#fragment` links --
    317 occurrences, entirely unswept, a LARGER population than the `§` citations that were swept.
    They resolve under a different model (heading slugification) and would need their own instrument.
    Numeric `§N` / `§6.4` references (72 occurrences) are likewise unswept, needing section-numbering
    semantics. Anchors cited FROM non-`.md` sources, and anchors INTO trees outside `.claude/`, are
    also unswept. And no sweep verified that a resolved section SAYS what its citation claims -- only
    that it exists.

    The dominant rejection class was manifest-declared absence (30 unique paths / 74 occurrences):
    artifacts correctly absent under loom_only, use_exclude, or use_obsoleted. That single check is
    what separates a clean surface from an apparently-broken one, and it is the check any upstream
    re-derivation of these numbers must apply first.

    The ONE genuine defect is ALREADY FILED in the preceding block and is NOT re-filed here: an
    absent bin/ instrument that two shipped artifacts instruct the agent to RUN while explicitly
    forbidding re-derivation, leaving a reader with no path forward. It carries no declared manifest
    fate (0 mentions; control: a declared sibling returns 5) while 32 peer .mjs files ship, so the
    tier does reach this template. It is already covered by that block's acceptance criterion B2.
    Recorded here only as INDEPENDENT CORROBORATION from a different population and a different
    instrument, which strengthens B2 rather than duplicating it.

    ALSO CLOSED, and it CORRECTED this block: full body-TEXT parity on the .coc/ lane. An earlier
    pass compared level-3 headings plus targeted greps and this block recorded the residual risk
    that "a drift living inside prose that leaves headings intact would NOT be detected". That risk
    MATERIALIZED. The full sweep (193 co-present pairs, 184 byte-identical) found nine drifts, and
    while six of them alter or delete a heading, the THREE THAT MATTER MOST do not: agents,
    zero-tolerance and testing invert normative force from "recommended" to "MUST/BLOCKED/ABSOLUTE"
    while the surrounding structure holds. Those are exactly the prose-interior case, and they are
    source divergence, so no regeneration clears them. The heading-level pass also produced one
    FALSE absence, corrected in S3-6.

    .coc/ skills parity is likewise CLOSED (41/41 entry points identical). The earlier objection --
    that a CC skill is a directory while a .coc/ skill is one file -- does not survive COC.md
    § Layout, which declares one file per skill as "the SKILL.md entry point"; entry-point-to-
    entry-point is therefore the contract-sound comparison, and non-entry-point siblings are outside
    .coc/'s declared contract rather than false positives. The
    USE-fence check covered 6 of 11 use_exclude entries against .coc/ only, so S3-3's five-artifact
    count is a FLOOR. Roughly 17 of the 25 passthrough hooks have no identified explanation. Hook
    write side effects were never diffed -- only exit status, stdout and stderr were compared. Only
    one CPU architecture was executed. No lane drove a real CLI session; all hook invocations used
    synthetic payloads.

    Reference-count figures from ANY regex-over-prose sweep in this block should be treated as upper
    bounds until classified by reading the hits: that instrument class overstated genuine defects by
    roughly 8x on two independent surfaces here.

use_template_findings_xref_classification_and_fragment_rot:
  header: >-
    Session 4 (2026-08-08). This block does NOT re-file B4. B4 already recorded the validator at
    exit 1 with 294 dangling rows, "no workflow runs it", the fix ordering, and an estimate that
    "roughly 218 of the 294 rows are legitimate absences". This block supplies what B4's prose-level
    requested_fix cannot be implemented without: an EXACT per-token classification of all 294 with
    manifest line numbers, and it corrects two things -- one in B4's framing and one in this
    session's own earlier framing.

    It also opens a class B4 does not cover at all and that NO instrument in this repo can see:
    line-range (#L) fragment anchors. That class turned out to carry a 100% defect rate and is the
    most serious finding here.

    Labels follow the preceding block's discipline. VERIFIED-BY-ORCHESTRATOR = re-derived
    independently with controls fired in both directions. LANE-REPORTED = an audit lane's result the
    orchestrator did not fully re-derive. RESPECT THE LABEL.

    Method note: three independent lanes classified one class each (105 journal / 121 backtick /
    68 md-link = 294, reconciling exactly). Each lane was told to refute the orchestrator where it
    could, and TWO of the orchestrator's claims were refuted -- both refutations are recorded below
    in preference to the original claims.

  what_this_session_got_wrong: >-
    Recorded first, because a Gate-1 reader should discount these two claims wherever else they appear.

    (1) The orchestrator filed `.claude/bin/ecosystem.json` (x10) as a WRONG-PATH defect. REFUTED by
    the backtick lane and re-verified: sync-manifest.yaml:3267 carries `- bin/ecosystem.json` under
    `loom_only:`, whose own `why` states that the committed `bin/ecosystem.example.json` (synthetic
    tokens) is the only ecosystem* file that DOES sync -- and that example file is present at 5811
    bytes. The cited path is CORRECT; the absence is by design. Root cause of the error: the manifest
    writes tier-relative `bin/X` for on-disk `.claude/bin/X`, so a `.claude/`-anchored grep misses
    every such entry. Any future audit of manifest fate MUST search both path forms.

    (2) The orchestrator reported the fragment-anchor surface as "overstated to near-empty" and
    proposed closing it. REFUTED by the md-link lane and re-verified. The orchestrator measured the
    SECTION-anchor sub-class, correctly found it inert, then generalised across a surface containing
    four sub-classes -- while the #L sub-class it had itself counted at 51 is where the rot lives.
    The prior session's "larger than the 16 section-citation breaks" framing was DEFENSIBLE and
    UNDERSTATED. See S4-3. Measuring one sub-class and concluding about the whole is the same
    epistemic shape as trusting a tally over a read.

  findings:
    - id: S4-1
      status: VERIFIED-BY-ORCHESTRATOR
      severity: LOW
      where: .claude/.proposals/latest.yaml (B4 requested_fix)
      finding: >-
        B4's "roughly 218 of the 294 rows are legitimate absences" is ACCURATE in aggregate and
        MISLEADING in distribution. Exact counts across all three classes: journal 105 legitimate;
        backtick 120 of 121 legitimate; md-link 0 of 68 legitimate. Total 225 of 294 = 76.5% against
        the estimate's 74.1%.
      why_it_matters: >-
        The estimate implies defects are spread across the corpus. They are not: 68 of the ~70
        required artifact edits sit in ONE class. A remediation plan built on the aggregate figure
        would spread effort evenly across three classes, two of which need no artifact edits at all.
      requested_fix: >-
        Replace the aggregate estimate with the per-class split. Note the backtick lane's own
        inference ("the estimate does not hold") was itself too strong -- it generalised from a
        99.2%-legitimate slice; corrected here by combining all three lanes.

    - id: S4-2
      status: LANE-REPORTED
      severity: HIGH
      where: .claude/.proposals/latest.yaml (B4 requested_fix) + .claude/bin/validate-xref-integrity.mjs
      finding: >-
        B4's requested_fix names THREE by-design-absent categories to teach the validator ("loom_only
        tooling, journal/, tier artifacts a consumer does not subscribe to"). The backtick class alone
        needs SIX. Missing three: `use_exclude` (16 occurrences), global `exclude:` globs (6), and the
        post-2026-07-15 fail-closed ALWAYS_INCLUDE bin regime (6).
      evidence: >-
        use_exclude tokens with manifest lines: rules/cross-repo.md x10 @3877; rules/loom-csq-boundary.md
        x4 @3860; rules/cross-sdk-inspection.md x1 @3854; rules/coc-artifact-eval-coverage.md x1 @3865;
        commands/test-harness-probe.md x1 @3866. Global exclude: rules/local/** @3755 (3 occurrences);
        **/*.test.mjs @3779 (3). Tier non-subscription: rules/stack-detection.md, tier `onboarding`
        @1894 vs py tier_subscriptions @4066.
      why_it_matters: >-
        A fix built to the three-category spec leaves roughly 28 backtick rows red, so it would FAIL
        B4's own acceptance criterion ("exits 0 on a clean consumer checkout") while appearing complete.
      requested_fix: Expand requested_fix to six categories before implementation begins.

    - id: S4-3
      status: VERIFIED-BY-ORCHESTRATOR
      severity: HIGH
      where: 18 distinct #L line-range anchors across .claude/skills/** (x3 mirrored into .codex/ and .gemini/)
      finding: >-
        Line-range fragment anchors are a wholly unmeasured rot class with a 100% defect rate. 51
        occurrences are 17 distinct anchors x 3 mirrored trees (51 = 17x3 exactly), plus an 18th in the
        backtick class. Verdict on all 18: 8 point PAST end-of-file, 9 resolve but land on unrelated
        content, 1 never resolves. ZERO are correct.
      evidence: >-
        Orchestrator-verified with `wc -l` + `sed -n` (both discriminating in both directions):
        agents/frameworks/dataflow-specialist.md is 110 lines, and skills/02-dataflow/dataflow-result-access.md:173
        cites #L991-L1001 -- `sed -n '991,1001p'` returns 0 lines, roughly 880 past EOF.
        agents/implementation/pattern-expert.md is 84 lines, and skills/31-error-troubleshooting/error-connection-params.md:209
        cites #L294-L338 while its own shipped prose claims "(lines 294-338)" -- returns 0 lines, i.e. a
        checkable falsehood in consumer-facing text. Root CLAUDE.md is 166 lines, so the 18th anchor
        (#L111-L177) overruns EOF by 11. Lane-measured, orchestrator-spot-confirmed: CLAUDE.md#L140 is a
        bare code-fence terminator cited as "Critical Rules"; #L139-L145 straddles a fence-close into the
        unrelated "## Kailash Platform" table while claiming "Critical Rules" (ground truth: "## Critical
        Execution Rules" is lines 126-141).
      why_it_matters: >-
        Line numbers drift on every edit, so this class rots silently and continuously. It is invisible
        to the validator by construction (S4-4), so no existing or planned gate catches it. Consumers are
        being pointed at wrong content by shipped prose that asserts what the range contains.
      requested_fix: >-
        Replace all 18 with section anchors or plain file references, and add a fragment-resolution pass
        to the validator (heading-slug resolution for #section, an EOF bound for #L). Fix only the
        .claude/ sources; .codex/ and .gemini/ are regenerated by emit-cli-artifacts.mjs.
        SEQUENCING CONSTRAINT, load-bearing: a PATH-only fix pass silently PROMOTES dead anchors into
        live-but-wrong ones. Demonstrated -- skills/16-validation-patterns/validate-workflow-structure.md:290
        is path-unresolved (4 hops escapes root, so its anchor is never evaluated), but the SAME #L139-L145
        range is cited from skills/31-error-troubleshooting/error-parameter-validation.md:198 via a 3-hop
        path that DOES resolve and lands on the wrong table. The path fix and the fragment fix MUST land
        together.

    - id: S4-4
      status: VERIFIED-BY-ORCHESTRATOR
      severity: MEDIUM
      where: .claude/bin/validate-xref-integrity.mjs:140-141 (MD_LINK_RE)
      finding: >-
        MD_LINK_RE captures the path in group 1 and swallows the fragment NON-CAPTURING via
        `(?:#[^)]*)?`. The validator therefore checks the FILE and never the FRAGMENT, and only for five
        extensions. S4-3's entire class is structurally invisible to it.
      why_it_matters: >-
        Teaching the validator its by-design-absent categories would take it to exit 0 while 51
        occurrence-level fragment defects remain uncounted. B4's acceptance criterion would then certify
        corpus health it has not measured.
      requested_fix: >-
        Add a fragment-resolution pass, and treat "exits 0" as scoped to the classes the validator can
        actually see until that pass exists.

    - id: S4-5
      status: VERIFIED-BY-ORCHESTRATOR
      severity: MEDIUM
      where: .claude/skills/30-claude-code-patterns/parallel-merge-workflow.md:140
      finding: >-
        The only MIS-RESOLVABLE citation in the corpus. It cites
        `journal/0003-RISK-spec04-silent-regression-via-parallel-merge.md`, while a live
        `workspaces/dev-container/journal/0003-DECISION-cross-repo-authorized-close-loom-384.md` exists in
        this template. Same number, unrelated topic -- a reader who resolves it lands on a cross-repo
        authorization decision instead of a parallel-merge regression post-mortem.
      evidence: >-
        Bounded by the orchestrator as the SOLE case across BOTH citation populations: workspace journal
        numbers are 0001-0005; cited numbers in the unbackticked population span 0006-0569, giving zero
        overlap (control: injecting 0003 into the `comm -12` intersection fires). The lane independently
        bounded the backticked population the same way, and separately attempted to REFUTE this row by
        surfacing 6 apparent bare `journal/0003` citations in workspace files -- which dissolved on
        READING: inside a workspace file a bare `journal/NNNN` is workspace-relative and resolves
        correctly (the cited entry genuinely contains the quoted text, and is the only file in the repo
        that does). Not collisions, not defects.
        INSTRUMENT CAVEAT on the orchestrator's own bound, raised by the lane and accepted: with
        range-min 0006 and workspace numbers 0001-0005, the collision intersection COULD NOT have returned
        any other answer -- the "0 collisions" result is ENTAILED by the range and therefore carries no
        independent information about citation hygiene. The injected-0003 control was still the right move
        (it establishes the matcher can fire), but the conclusion is not load-bearing evidence. What
        actually bounds this row is the reading of the hits, not the intersection.
      why_it_matters: >-
        Every other finding in this class is merely unresolvable, which a reader notices. This one
        resolves to the WRONG document, which a reader does not notice.
      requested_fix: >-
        Requalify to `loom/journal/0003-RISK-...`. Measured side benefit: the qualified form matches NONE
        of the validator's three extractors (BACKTICK_JOURNAL_RE, BACKTICK_RE whose prefix set excludes
        `loom/`, MD_LINK_RE), so it self-removes from the scan rather than relocating into a sibling class.
        Scope to this ONE line; requalifying all 105 would mean 105 edits across 40 synced artifacts.

    - id: S4-6
      status: LANE-REPORTED
      severity: MEDIUM
      where: .claude/bin/validate-xref-integrity.mjs (:419-437 resolver, :649-656 partition, :714-751 reporting)
      finding: >-
        All 105 `[journal]` findings are correct-by-design provenance pointers sharing ONE structural
        cause, not 105 individual defects. A consumer's journals are workspace-scoped
        (workspaces/<name>/journal/, numbered from 0001); loom's are root-scoped, so a root journal/NNNN
        can never resolve downstream. 61 of 105 sit in an explicit provenance section; the lane READ the
        other 44 and found the substantive claim stated inline in every one. Stripping them would violate
        the Origin-provenance requirements in artifact-flow.md, rule-authoring.md and trust-posture.md --
        the journal reference IS the audit trail.
      evidence: >-
        Deduced from code-path order with no experiment needed: `malformed-journal-token` (:419-420)
        precedes the readdirSync, so all 105 having reported `journal-dir-missing` proves every token is
        well-formed. Confirmed by driving the exported resolver against synthetic roots: all 105 resolve
        once a populated root journal/ exists (57 distinct numbers), zero still dangle, with controls
        proving the instrument CAN emit `malformed-journal-token` and `journal-entry-not-found`.
      requested_fix: >-
        A reason-scoped skip bucket, NOT an allowlist (98 entries would be unmaintainable) and NOT a
        directory-existence guard. The lane initially proposed adding an existsSync guard and then
        withdrew it: `journal-dir-missing` is returned from exactly one site and is therefore
        self-certifying, while a second existsSync probe would return TRUE for a stray `Journal/` on a
        case-insensitive filesystem and silently un-skip the whole class. Predicate:
        `finding.kind === "journal" && finding.reason === "journal-dir-missing"`, added to the :649-656
        partition cascade so the four buckets stay mutually exclusive and sum to notFound.length, plus a
        labelled reporting bucket and a `skipped_journal_root` array in --json so the skip is auditable
        rather than silent. `journal-entry-not-found` keeps failing loud, so the check is RELOCATED to
        loom (where a root journal/ exists and it can discriminate), not deleted. Fixtures required per
        cc-artifacts.md Rule 9: next free number is 25; add 25 (root absent => skipped not dangling),
        26 (root present but empty => still dangling -- the fixture that proves this is not a blanket
        suppression), 27 (the four buckets are mutually exclusive and sum).
        Pair with ONE note in rules/journal.md rather than 35 near-identical paragraphs; the lane
        disclosed that this note will not fire at the moment of confusion because journal.md is
        path-scoped on journal/** and a reader hitting journal/0543 in agents.md never loads it -- the
        same reachability shape issue-triage-routing.md documents in its own Origin.

    - id: S4-7
      status: LANE-REPORTED
      severity: LOW
      where: .claude/bin/validate-xref-integrity.mjs:431-433
      finding: >-
        TWO blind spots with ONE root cause -- `:431-433` prefix-matches via
        `n === "NNNN.md" || n.startsWith("NNNN-")`, so anything after the number is never examined.
        (a) SLUG: 13 of the 105 citations are full-filename form, so a right-number/wrong-slug citation
        resolves GREEN even at loom. (b) RANGE ENDPOINT: a span citation such as `journal/0082-0084`
        resolves green on its LEFT endpoint alone -- `resolveJournalToken`'s
        `^journal\/(\.pending\/)?(\d{3,4})` captures only the first number, and `0082-0084` then satisfies
        the `0082-` prefix match. The right endpoint is never checked even though checking it alone WOULD
        flag it.
      evidence: >-
        Range behaviour measured against the real resolver by the refutation lane, with a control root
        holding `0082-DECISION-real-entry.md` and deliberately no `0084`: `journal/0082-0084` -> RESOLVED;
        `journal/0082` -> RESOLVED; `journal/0084` -> journal-entry-not-found (the control proving the
        missing endpoint IS detectable in isolation); `journal/0082-0084-more` -> RESOLVED. Two range
        citations exist today (`guides/rule-extracts/artifact-flow.md:126` and one per-operator tracker
        file), neither currently in scope -- but the guides one enters scope under S4-17.
      why_it_matters: >-
        A citation can name the wrong entry, or silently validate a SPAN by testing one end, and pass the
        very check that exists to catch exactly that. The range case is one degree worse than the slug case
        because the reader is told a range was verified when only its first element was.
      requested_fix: >-
        Compare the full cited filename when one is given, and reject or fully resolve a range form rather
        than prefix-matching its left endpoint. Both are pre-existing and orthogonal to S4-6; that fix
        neither creates nor closes either. Note the interaction with S4-17: adding guides to scope brings a
        live range citation into the extractor, so this row should land with or before S4-17.

    - id: S4-8
      status: VERIFIED-BY-ORCHESTRATOR
      severity: LOW
      where: .claude/bin/validate-xref-integrity.mjs:228-262 (SANCTIONED_ABSENT_REFS entry 2)
      finding: >-
        Dead code. The entry sanctions `.claude/rules/local/local-manifest.yaml` with `sources` scoped to
        `.claude/rules/local/_README.md`, but `rules/local/**` is globally excluded at manifest:3755
        ("Never distributed to a target"), so that source never ships and the entry can never match at any
        consumer.
      requested_fix: Retire or re-scope in the same fix as S4-2.

    - id: S4-9
      status: VERIFIED-BY-ORCHESTRATOR
      severity: LOW
      where: .claude/rules/instrument-discipline.md:78 and .claude/rules/wave-loop.md:303
      finding: >-
        Two occurrences an allowlist addition would NOT clear, because the validator's shape guard fails
        independently of the allowlist. instrument-discipline.md:78 reads "Phase 2 deferred" with no
        parenthesis while `PHASE2_DEFERRED_RE = /Phase[\s-]?2\s*\(deferred/i` requires a literal `(`
        (both verified). wave-loop.md:303 carries the path on a CONTINUATION line while the guard is
        line-scoped.
      requested_fix: >-
        Either reword both citing lines into the canonical same-line form, or widen the guard to a
        paragraph window. The lane proved the guard fails but declined to choose the fix, since the guard
        lives in a synced script and the choice is loom's.

    - id: S4-10
      status: LANE-REPORTED
      severity: LOW
      where: .claude/bin/validate-xref-integrity.mjs:349-377 (stripFencedBlocks)
      finding: >-
        The fence stripper is run-length-blind: it matches `(```+|~~~+)` then compares only `run[0]`, the
        character, ignoring run length. In a 4-backtick-fenced block containing an inner 3-backtick fence,
        content between the inner fences SURVIVES stripping where CommonMark would strip it. It produces a
        parity FLIP, not uniform leakage, so it is a latent source of both false positives and false
        negatives in any nested-fence file.
      requested_fix: Compare run length, not just the fence character.

    - id: S4-11
      status: VERIFIED-BY-ORCHESTRATOR
      severity: MEDIUM
      where: .claude/skills/16-validation-patterns/validate-workflow-structure.md:289
      finding: >-
        The one genuinely wrong path in the backtick class, found independently by two lanes. It cites
        `.claude/agents/pattern-expert.md`; the agent lives at
        `.claude/agents/implementation/pattern-expert.md` (present, manifest-declared in the `kailash` tier
        @1706) and the cited path does not exist. DOUBLE-broken: the `implementation/` segment is missing
        AND the `../../../../` depth escapes the repo root for a file at
        `.claude/skills/16-validation-patterns/`.
      requested_fix: >-
        `../../agents/implementation/pattern-expert.md`. Both the backtick token and the md-link half of
        the same line carry the identical error, and line :290 carries an #L anchor with the same bad
        depth -- fix all three together per S4-3's sequencing constraint.

    - id: S4-12
      status: LANE-REPORTED
      severity: MEDIUM
      where: .claude/skills/18-security-patterns/SKILL.md:67,68,69,73,74,75,79,80
      finding: >-
        Eight phantom citations -- `security-{secrets,input-validation,injection-prevention,auth-patterns,api-keys,tokens,owasp-top10,audit-checklist}.md`.
        Zero manifest hits for all eight (control: `skills/18-security-patterns` itself has 14 manifest
        hits, so the matcher fires), and `git log --all --diff-filter=A` shows none ever existed in this
        repo's history. Only `security-attack-chains.md` did, and it exists. This is a phantom-citation
        section, not a rename.
      why_it_matters: >-
        spec-accuracy.md Rule 1 class -- a reference index whose entries never existed teaches a fictional
        layout of the security skill.
      requested_fix: Delete the eight bullets, or author the files.

    - id: S4-13
      status: LANE-REPORTED
      severity: MEDIUM
      where: the state-file-mutation detector reached via the Bash PreToolUse boundary
      finding: >-
        Two false positives, both carrying `block` severity (hard stop, not halt-and-report, not
        advisory), against a read-only repo scan. Layer 3 matched a `json.dump(` token in a python
        heredoc's SOURCE TEXT; Layer 1 matched a heredoc+redirect BUNDLE SHAPE. Neither command names any
        state path anywhere -- the only write targets were under /tmp. The second block's stated reason
        asserts "a redirect ... on a literal state path", which was factually not the case.
      why_it_matters: >-
        A lexical source-text match carrying `block` sits in tension with hook-output-discipline.md MUST-2.
        The detector cannot distinguish an interpreter body writing to /tmp from one writing to a state
        file, so its output is identical whether the proposition "this command mutates state" is true or
        false -- non-discriminating on write target per instrument-discipline.md MUST-1, while still hard-
        stopping. The lane routed around it via a Write-authored script rather than asking a peer to run
        the blocked command, which would have laundered the permission decision.
      requested_fix: >-
        Resolve the write TARGET rather than matching source text, or downgrade the lexical layers to
        advisory per hook-output-discipline.md MUST-2. Reproduction: any python3 heredoc containing a
        `json.dump(...)` / `open(...,'w')` token with a /tmp-only target, or any heredoc with a
        `> /tmp/...` redirect.

    - id: S4-14
      status: VERIFIED-BY-ORCHESTRATOR
      severity: LOW
      where: .claude/rules/worktree-isolation.md:250 and .claude/skills/30-claude-code-patterns/worktree-orchestration.md:719
      finding: >-
        A SHIPPED rule instructs the reader "The committed instrument is `bin/probe-ancestor-load.mjs`; do
        NOT re-derive it from prose" -- and that file is absent from this template. The rule forbids the
        only workaround it leaves the reader.
      why_it_matters: >-
        A consumer told not to re-derive a file it does not have is stuck, and the prohibition is what
        makes it a defect rather than a missing-nice-to-have.
      requested_fix: >-
        Either ship the instrument to the USE lane or soften the prohibition for repos that do not receive
        it. Note the file's distribution fate is itself unresolved -- see S4-16.

    - id: S4-15
      status: VERIFIED-BY-ORCHESTRATOR
      severity: MEDIUM
      where: .claude/bin/validate-xref-integrity.mjs:136 (BACKTICK_JOURNAL_RE)
      finding: >-
        BACKTICK_JOURNAL_RE requires a BACKTICKED `journal/NNNN`, so the validator cannot see journal
        citations in other shapes. It sees 105 of 604 journal references repo-wide (17%). Blindness splits
        into ~190 in-scope-but-wrong-shape (186 plain prose + 4 path-qualified) and 309 out-of-scope.
      evidence: >-
