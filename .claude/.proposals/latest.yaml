        the small deltas against 42/11/27 are its fence-stripping, not a disagreement.
      why_it_matters: >-
        This is the real answer to "does exit 0 overstate corpus health", and it is worse than a coverage
        gap. `self-referential-codify.md` puts `.claude/guides/rule-extracts/**` on its allowlist with an
        explicit rationale: a rule's extracted depth carries its BLOCKED corpus, so "an edit there changes
        the rule's enforcement surface exactly as an edit to the rule body does". A cross-reference
        validator that skips that tree is therefore silent on the ENFORCEMENT-BEARING half of the rule
        corpus while reporting exit 0 over the other half. The 28 extracts are precisely the depth files
        the baseline rules point readers to.
      requested_fix: >-
        Add `.claude/guides` to DEFAULT_SCOPE_DIRS. Sequence it AFTER the backtick and md-link remediations
