    - id: 6
      cluster: C
      status: confirmed
      where: ".claude/hooks/validate-bash-command.js — state-file-mutation block message"
      finding: >-
        The guard's BEHAVIOUR is correct and is not disputed. The gap is its remediation text.
        It tells the reader to use "an interpreter body with NO write token", but never
        discloses that a shell-out counts as one. A reader with read-only intent does not
        think of execSync as a write token, so the message sends them straight back into the
        same block with no way to learn why.
      evidence: >-
        A case-insensitive search for execSync|child_process|subprocess|spawn|shell-out|shell
        across the whole block-message branch returns exactly ONE hit, and reading it (rather
        than counting it) shows it is a source comment about quoting, outside every emitted
        string field. The file's three child_process occurrences are its own spawnSync imports,
        hundreds of lines above the branch. Controls confirm both the slice and the token class
        are matchable in this file, so the empty result is a true negative.
      confirmed_mechanism: >-
        The shell-out class IS live: violation-patterns.js::STATE_INTERP_WRITE_SOURCES
        category (6) "SHELL-OUT FROM INSIDE THE BODY" compiles into STATE_INTERP_WRITE_RX,
        matching os.system, subprocess.*, child_process, exec/execFileSync, spawn/spawnSync,
        Popen/popen, plus ruby/perl %x{} and qx{} command-substitution forms.
      requested_fix: >-
        One clause in the remediation text, e.g. "...with NO write token (note: a shell-out
        such as execSync / child_process / subprocess counts as a write token, because the
        scanner cannot analyse the inner command — fetch shell values OUTSIDE the interpreter
        body and pass them in via env or argv)." The final part is the fix a reader actually
        needs and it is currently stated nowhere in the message.

    - id: 7
      cluster: C
      status: confirmed-structural-risk
      where: "sync-manifest.yaml § dev_container_ownership + .claude/dev-container-templates/py/"
      finding: >-
        requirements-coc.txt is loom-distributed, so emit-dev-container can overwrite it from
        loom's source. It is the install surface the published dev-container image is built
        from (Dockerfile COPY -> uv pip install -r), so emitting a stale source silently
        downgrades every framework pin in the next published image.
      evidence: >-
        Membership chain verified end-to-end: py is in loom_distributed; loom_distributed.py.classes
        includes publisher_internal; requirements-coc.txt is in publisher_internal_variants.py; and
        the manifest states the class lists ARE the distribution set for variants named in
        loom_distributed, sourced from .claude/dev-container-templates/py/. Independently
        corroborated by the file's own first line, which declares it "generated INTO consumer
        templates by /sync-to-use; do not hand-edit the consumer copy".
      current_state_is_correct: >-
        The repo-root file matches .claude/VERSION::sdk_packages on all five SDK packages it
        pins (kailash 2.62.0, dataflow 2.19.1, nexus 2.15.0, kaizen 2.45.0, pact 0.18.0).
        Accuracy note for triage: sdk_packages has NINE entries, not five — ml and align live in
        the opt-in requirements-coc-ml.txt, and mcp and kaizen-agents are metadata-only. The file
        also pins ruff and black, which sdk_packages does not track.
      unverifiable_here: >-
        Whether loom's copy is STILL stale. This repo's .claude/VERSION carries a dated
        self-report (2026-08-02) that loom's copy is at the 2.44.1 set and that
        emit-dev-container was deliberately NOT run because it would regress these pins. That
        is a dated claim about another repo, not a current measurement; settling it needs a
        cross-repo read that was not authorized. Treated as inference, not present fact.
      requested_fix: >-
        Preferred (durable): have emit-dev-container REFUSE to emit a requirements-coc.txt whose
        pins are OLDER than the destination's, failing loud rather than silently downgrading.
        This converts a silent regression into a blocked sync and does not depend on anyone
        remembering to refresh the source. Secondary: refresh loom's py source to the current set.

    - id: 2
      cluster: C
      status: confirmed-reproduced
      where: ".claude/commands/sweep.md — Sweep-9 pre-condition gate"
      finding: >-
        The gate dynamically imports .claude/bin/lib/loom-links.mjs and attaches .catch() to the
        import promise chain, so a module-resolution failure and a genuine resolver error land in
        the same handler and both emit the ERROR sentinel. The N/A sentinel lives inside .then()
        and is unreachable when the import itself rejects. Because the command's own text states
        that an ERROR sentinel "is itself a finding", every consumer lacking the module reports a
        false finding on every /sweep run.
      evidence: >-
        REPRODUCED in this repo — running the gate verbatim emits
        "<!-- sweep-ecosystem:v1:ERROR reason=Cannot find module ... -->". Note the process exits
        0, so the exit code cannot discriminate; only the emitted sentinel string can. The module
        is absent BY DESIGN, not by accident: sync-manifest.yaml fences bin/lib/loom-links.mjs as
        loom_only ("a consumer resolves nothing cross-repo"), which SUPPRESSES future emission —
        and the already-distributed USE-template copy is purged by the `use_obsoleted:` twin. The
        `obsoleted:` entry is NOT the USE-lane mechanism: it sits under a BUILD-lane header and
        purges the BUILD copy only. TWO drafts got this wrong in OPPOSITE directions — the first
        attributed the USE-lane absence to the BUILD-lane `obsoleted:` entry; the correction then
        over-swung to "NOT an obsoleted: purge entry", which reads as "no purge entry covers the
        USE lane" and is equally false. Both `loom_only` AND `use_obsoleted` cover the USE lane, in
        complementary roles (the manifest states the split explicitly: sync-tier-aware.mjs reads
        `obsoleted` on the BUILD lane and `use_obsoleted` on the USE lane). So the
        intended N/A case is precisely the case that produces ERROR.
      scope: >-
        Fires on all 30+ consumers, on every run. NOT merely noise — there is a disclosure
        dimension an earlier draft of this item missed. The ERROR sentinel embeds the failed
        module's ABSOLUTE path, which on any consumer is an operator home path. sweep.md itself
        says the ERROR sentinel "is itself a finding — surface it", and the command's Closure
        step commits the report; the same command separately requires scrubbing operator-absolute
        paths before committing. So every /sweep run on every consumer manufactures a
        path-bearing sentinel that the command then instructs the agent to roll into a committed
        artifact, defended only by a judgment-level scrub (user-flow-validation.md MUST-6). The
        N/A fix removes the sentinel — and with it the recurring scrub obligation — at the source.
      self_referential_gate: >-
        commands/sweep.md IS on the self-referential-codify.md Rule-2 allowlist as a LIVE firing
        entry (backticked, depth-0, between redteam.md and wrapup.md), so the fix needs the
        Tier-1 multi-agent gate.
      requested_fix: >-
        Discriminate ERR_MODULE_NOT_FOUND from a genuine resolver error and emit the N/A sentinel
        for the former, keeping ERROR for the latter.

