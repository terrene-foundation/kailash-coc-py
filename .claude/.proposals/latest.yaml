      where: ".claude/hooks/validate-bash-command.js — state-file-mutation block message"
      finding: >-
        The guard's BEHAVIOUR is correct and is not disputed. The gap is its remediation text.
        It tells the reader to use "an interpreter body with NO write token", but never
        discloses that a shell-out counts as one. A reader with read-only intent does not
        think of execSync as a write token, so the message sends them straight back into the
        same block with no way to learn why.
      evidence: >-
        A case-insensitive search for execSync|child_process|subprocess|spawn|shell-out|shell
        across the whole block-message branch returns exactly ONE hit, and reading it (rather
        than counting it) shows it is a source comment about quoting, outside every emitted
        string field. The file's three child_process occurrences are its own spawnSync imports,
        hundreds of lines above the branch. Controls confirm both the slice and the token class
        are matchable in this file, so the empty result is a true negative.
      confirmed_mechanism: >-
        The shell-out class IS live: violation-patterns.js::STATE_INTERP_WRITE_SOURCES
        category (6) "SHELL-OUT FROM INSIDE THE BODY" compiles into STATE_INTERP_WRITE_RX,
        matching os.system, subprocess.*, child_process, exec/execFileSync, spawn/spawnSync,
