    - id: S4-17
      status: VERIFIED-BY-ORCHESTRATOR
      severity: HIGH
      where: .claude/bin/validate-xref-integrity.mjs:302-308 (DEFAULT_SCOPE_DIRS)
      finding: >-
        The validator does not scan `.claude/guides` at all. DEFAULT_SCOPE_DIRS is exactly
        [".claude/commands", ".claude/rules", ".claude/skills", ".claude/agents"] -- guides is absent.
        That tree holds 28 rule-depth extracts and 42 journal references across 11 files, 27 of them
