# ----------------------------------------------------------------------------
# M5 — Cross-Repo Sync Governance proposal
#
# Originating workspace: workspaces/dev-container/ (F4 — CLOSED 2026-05-31)
# Receipt chain:
#   - sweep:    workspaces/dev-container/04-validate/sweep-2026-05-31.md
#   - convergence: workspaces/dev-container/04-validate/round-6-verdict.md
#   - merge:    PR #32 (9cf7e8d)
#   - image:    terrenefoundation/kailash-coc-py:1.10.1 (sha256:43944a514245…)
#   - publish:  .github/workflows/publish-dev-image.yml (self-driving on `git tag v<X.Y.Z>`)
#
# What this proposal asks loom to do:
#   1. INGEST the eight files below at Gate-1 as **template-owned** artifacts
#      (regenerated on every /sync — sibling treatment to Dockerfile / bin/coc
#      / .claude/** today).
#   2. DECLARE the preserve-glob set in sync-manifest.yaml so project-owned
#      overlays (per-operator Dockerfile.user, compose.override.yml, root
#      package.json / lockfiles, *.user.* siblings) survive /sync untouched.
#   3. ENACT both via the next /sync cycle so 30+ downstream USE/project
#      consumers inherit the dev-container substrate uniformly.
#
# Why this is a USE-template proposal (not a loom-origination):
#   The dev-container scaffold was built + shipped in kailash-coc-py (F4
#   workspace). loom has no upstream audit trail for these files yet; per
#   rules/artifact-flow.md § "loom Splits, Never Originates", loom may NOT
#   author the files directly. This proposal is the upstream audit trail
#   loom's Gate-1 needs.
# ----------------------------------------------------------------------------

