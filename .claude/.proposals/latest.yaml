      local_disposition: >-
        QUALITATIVE BY DESIGN — NO COUNT IS STATED HERE, AND THAT IS THE FIX. In the originating
        repo the leftover `.session-notes.migrated` is superseded in SUBSTANCE: the only content
        unique to it is the stale, since-rewritten versions of ledger rows (a corrected F15 row, a
        refuted F11 row, a completed F14 row). Nothing of CURRENT value is unique to it, so deleting
        it loses nothing — but it is UNTRACKED, so deletion has no reflog (git.md § Destructive
