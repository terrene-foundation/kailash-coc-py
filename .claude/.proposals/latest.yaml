use_template_root_cause_analysis_and_structural_fix:
  header: >-
    Session 4 (2026-08-08), authored AFTER the four findings blocks above and derived from them.
    This block contains NO new findings. It is a causal analysis plus ONE structural recommendation,
    and it argues that the sequencing requested by the block above it is BACKWARDS.

    Read it against, not merely alongside, `use_template_findings_xref_classification_and_fragment_rot`.
    That block asks loom to teach the downstream validator six by-design-absent categories, then wire
    it. This block argues that the category list is a treadmill by construction, that the information
    it encodes is already computed elsewhere, and that the gate belongs at emit time instead. The
    findings block is not wasted under this reading -- its per-token classification is precisely the
    migration input the structural fix needs, and its acceptance criteria are already the checklist
    for step 1 -- but its ORDER should be inverted before implementation begins.

    One claim in this block is an ASSUMPTION about a component that cannot be read from a consumer.
    It is labelled inline and named again in confidence_bound. Do not implement step 2 before
    checking it at loom.

  root_cause: >-
    Cross-references in this corpus are UNTYPED STRINGS WITH NO DECLARED AUDIENCE, inside a
    distribution system that deliberately projects a different file set to every consumer. Every
    defect class measured in the block above falls out of that one fact, via two distinct mechanisms.

    ROT. A hand-typed path has no compiler, no import resolution, and no rename refactoring. Moving
    an artifact silently breaks every prose citation naming it -- the pattern-expert case (S4-11).
    Line-range anchors are the degenerate form: they break when the TARGET is edited, with nobody
    touching the reference and nothing moving. That is why that class measured a 100% defect rate
    (S4-3) while path-only classes did not. The defect distribution is what the causal claim
    predicts, which is the main evidence for it.

    AMBIGUITY. The token `rules/cross-repo.md` is a VALID reference at loom and an unresolvable one
    at a USE template. The reference carries no information about who is expected to resolve it, so a
    downstream checker cannot separate "rotted" from "correctly absent here" without consulting a
    manifest. That is why 225 of 294 findings are noise (S4-1), and why the six-category fix (S4-2)
    is a treadmill rather than a fix: each new distribution fate adds a seventh category, and the
    category list is maintained in a different place from the manifest that actually decides.

  recommendation: >-
    MAKE THE EMITTER THE GATE, NOT THE CONSUMER. Validate references at EMIT time against the exact
    file set each target receives, and give references a declared KIND so "unresolvable downstream" is
    stated intent rather than inferred absence. Demote the downstream validator from primary gate to
    backstop.

    The leverage: the manifest ALREADY COMPUTES THE ANSWER. At Gate-2 the emission engine determines
    exactly which files a given target will receive. That is the one place where "correct absence"
    versus "rot" is decidable with zero heuristics and zero hand-maintained categories -- the manifest
    becomes the category system instead of having one maintained beside it. The present model ships
    first and asks 30+ consumers each to guess, using a category list, over an input that is ambiguous
    by construction.

  staged_plan: >-
    Ordered by ratio of defect-removal to design risk, NOT by severity.

    STEP 1 -- Ban line-number anchors outright and fix the 18. No correct usage of the form exists in
    this corpus (18 of 18 defective, S4-3): the FORM is unmaintainable, not the instances. Heading
    anchors survive edits; line numbers cannot. Smallest change, highest defect density, no design
    work, and it does not depend on any of the steps below. Do this first regardless of what happens
    to the rest of this block.

    STEP 2 -- Emit-time resolution against the computed per-target file set. Kills the ~225-finding
    noise class AND the category treadmill in one move, because the manifest stops being consulted by
    a second, separately-maintained list. THIS IS THE STEP GATED ON THE ASSUMPTION BELOW.

    STEP 3 -- Declared reference kinds for what is legitimately unresolvable downstream: loom
    provenance pointers (the journal class, S4-6/S4-15) and loom-only tooling (S4-16, S4-14). The
    `loom/journal/NNNN-...` qualification proposed at S4-5 is exactly this idea applied to one line;
    generalise the form rather than requalifying line by line. This is a corpus-wide authoring change
    across roughly 2,600 cross-reference tokens (validator-reported: 2602 scanned), so stage it over
    several cycles -- it is the slowest part and the least urgent.

    STEP 4 -- Demote the downstream validator to a backstop. Keep it: consumers lag syncs, and a
    consumer that has not re-synced still needs a local check. But stop treating it as the primary
    gate, and scope its exit-0 semantics per S4-17 so a green run is read as bounded rather than as a
    clean bill of health.

    NOTE the interaction with S4-17 (guides tree unscanned): under this plan S4-17 becomes an
    emit-time scope question rather than a downstream one, but it should still be fixed downstream in
    the interim because consumers on the current model are silent on the enforcement-bearing half of
    the rule corpus until step 2 lands.

  honest_cons: >-
    Stated because they are real and they bound the recommendation, not to balance it.

    (1) It moves work onto the emission engine, which is more complex than a standalone consumer-side
    script and sits on the `self-referential-codify.md` Bin allowlist -- so every change there pays a
    Tier-1 multi-agent redteam. Higher cost per change than patching the downstream validator.

    (2) It does nothing for EXISTING consumers until they re-sync. The downstream validator therefore
    cannot be deleted, only demoted; a transition period exists where both layers run.

    (3) Step 3 is a corpus-wide authoring migration. That is the largest single piece of work implied
    here and the one most likely to be deferred indefinitely once the acute pain is gone.

    (4) It cannot fix cross-repo provenance pointers. Those are CORRECTLY unresolvable downstream by
    design; they need declaring (step 3), not resolving. Any expectation that emit-time validation
    makes every reference resolve everywhere is wrong and would produce pressure to strip legitimate
    provenance -- the outcome S4-6 explicitly argues against.

    (5) The plan reorders work the block above already specified. If loom has begun implementing the
    six-category fix, steps 1 and 2 partially strand that effort. The classification itself is NOT
    stranded -- it is step 2's input -- but the allowlist-authoring portion would be.

  confidence_bound: >-
    HIGH on the causal analysis. It is derived from measurement rather than intuition, and the
    observed distribution of defects across classes is what the stated cause predicts: the class that
    rots without anyone touching it (line ranges) is the class that measured 100% defective, while
    path-only classes did not.

    LOWER, and explicitly so, on step 2's implementability. The emission engine
    (`sync-tier-aware.mjs`) is loom-only and ABSENT from a consumer repo, so this recommendation is
    designed against a component the author could not read. That it computes a per-target file set at
    Gate-2 is an INFERENCE from manifest commentary and observed sync behaviour, NOT a verified fact,
    and whether references can be cleanly resolved at that point is unknown from here. CHECK THIS AT
    LOOM BEFORE COMMITTING TO THE SEQUENCE. If the inference is wrong, step 1 still stands alone,
    step 3 still stands alone, and only step 2 -- the load-bearing one -- needs redesign.

  acceptance_criteria:
    - "[ ] Step 1: no line-range anchor form remains in .claude/**, and the form is prohibited in the authoring rules so it cannot re-enter."
    - "[ ] Step 2 PRECONDITION: someone with loom access confirms or refutes that the emission engine can resolve references against a target's computed file set at Gate-2. Record the answer before any implementation."
    - "[ ] Step 2: a reference that a given target cannot resolve is detected at EMIT time for that target, with no hand-maintained by-design-absent category list consulted."
    - "[ ] Step 2: the six categories enumerated at S4-2 are derivable from the manifest rather than restated in the validator."
    - "[ ] Step 3: every reference that is unresolvable-downstream-by-design carries a declared kind; a bare unqualified path that cannot resolve at its target is a failure, not a judgment call."
    - "[ ] Step 4: the downstream validator still runs and still catches rot on an unsynced consumer, and its exit-0 semantics are scoped per S4-17."
    - "[ ] The sequencing conflict with use_template_findings_xref_classification_and_fragment_rot is resolved EXPLICITLY at Gate-1 -- either this block's order is adopted and that block's requested_fix is amended, or this block is rejected with a reason. Both blocks silently proceeding is the failure mode."

  disclosure_scrub: >-
    This block names only .claude/ artifact-surface paths and loom-side component names already
    present in the manifest and in the blocks above. No operator identity, no absolute path, no
    client or tenant identifier, and no downstream-consumer name appears.

use_template_root_cause_amendment_scope_is_rationed_by_context_budget:
  header: >-
    Session 4 (2026-08-08), authored AFTER and SUPERSEDING the recommendation in
    `use_template_root_cause_analysis_and_structural_fix`. That block's diagnosis was one layer
    short and its headline recommendation was partly REDUNDANT WITH MACHINERY THAT ALREADY SHIPS.
    Both blocks are retained: the superseded one is left standing rather than edited, because the
    correction trail is itself the finding (the diagnosis only deepened once the corpus was checked
    for an existing mechanism instead of assumed to lack one).

    What is WITHDRAWN from the prior block: its step-2 framing ("build emit-time resolution") as the
    load-bearing move, and its confidence_bound, which named an unreadable emitter as the key
    unknown. The emitter question is now largely moot -- the gate exists. What SURVIVES from it
    unchanged: step 1 (ban line-number anchors; it is now shown to be an EXISTING rule needing
    scope, not a new one), step 3 (declared reference kinds), step 4 (demote the downstream
    validator), and the entire root_cause and honest_cons sections, which remain accurate as far as
    they go.

  the_finding_that_forced_the_amendment: >-
    THE RULE THAT BANS THIS EXACT DEFECT ALREADY EXISTS, AND ITS SCOPE EXCLUDES EVERY PLACE THE
    DEFECT LIVES. Four verified facts, each re-derived this session:

    (1) `.claude/rules/symbol-anchored-citations.md` MUST-1 states verbatim: "A bare `<path>:<NNN>`
    (or `<path>:<NNN-MMM>`) as the SOLE locator is BLOCKED." Its stated rationale is our failure mode
    word for word -- a bare line number is "invalidated by ANY insertion above it" and "then silently
    points at the wrong code". Its Origin (2026-06-30, receipt `journal/0375`) is the same defect
    found in specs/todos.

    (2) That rule is `scope: path-scoped` with `paths:` = `**/specs/**`,
    `**/workspaces/**/specs/**`, `**/02-plans/**`, `**/01-analysis/**`, `**/briefs/**`,
    `**/todos/**`, `**/journal/**`.

    (3) The 18 defective line-range anchors (S4-3) live in `.claude/skills/01-core-sdk`,
    `.claude/skills/02-dataflow`, `.claude/skills/16-validation-patterns` and
    `.claude/skills/31-error-troubleshooting`. A grep of the defect sites against the rule's glob
    set returns ZERO matches. The rule does not load where the defect is authored, so it never fires.

    (4) The emit-time gate the prior block asked loom to BUILD already ships:
    `.claude/bin/emit-derives-from.mjs`, `.claude/hooks/lib/derives-from-edge.js` (carrying
    `classifyAnchor` at :307, consumed at :456 and :537) and
    `.claude/hooks/lib/derives-from-ledger.js`. `specs-authority.md` Rule 11 already mandates
    grep-stable anchors that resolve TODAY, uniquely and non-vacuously, with a closed `anchor_kind`
    set, and already fails LOUD (non-zero exit; "the session MUST NOT proceed past it"). It is
    scoped to the provenance-edge surface, not to prose bodies.

  the_deeper_root_cause: >-
    SCOPE IS RATIONED BY CONTEXT BUDGET, NOT SET BY SUBJECT. Enforcement rides on per-session rule
    injection, which is a saturated resource, so widening a rule's coverage costs context in EVERY
    session forever. Rules therefore get scoped to what fits the budget rather than to what their
    subject requires -- and defects concentrate precisely in the unscoped remainder.

    The corpus records this about itself, repeatedly and independently of this session:
    `completion-criterion.md`'s Detection block states that `**/workspaces/**` and `**/journal/**`
    globs were authored and then REMOVED because the measured injection profile stood at 100.8% of
    budget BEFORE that rule was added; `burn-down-reporting.md`'s Detection block records that a
    session editing only `src/` can close without the rule ever loading; and
    `issue-triage-routing.md` exists ENTIRELY because routing depth sat behind path globs a `gh`
    triage never matches. Three separate rules, three separate authors, one shape.

    The same pressure produces the cross-references in the first place. Budget saturation is what
    drives depth OUT of loaded rules into unloaded guide/skill files (`rule-authoring.md` Rule 10
    paired extraction, `cc-artifacts.md` Rule 3's command cap, `command-skill-parity.md`), and every
    extraction manufactures pointers as its byproduct. So the budget generates BOTH the pointers AND
    the blind spot they rot in. That is why the prior block's "untyped strings" diagnosis was true
    but not root: it described the artifact of the pressure rather than the pressure.

  recommendation: >-
    STOP ENFORCING MECHANICALLY-DECIDABLE RULES THROUGH INJECTED CONTEXT. Move them into the
    emit/CI gate, where coverage costs nothing per session, and shrink their prose to a pointer at
    the check.

    "Is the sole locator a bare `path:NNN`?" is a regex over a diff, not a judgment. It does not need
    to occupy an agent's context to be enforced -- and once it does not, its scope can be the whole
    corpus at zero per-session cost. Today, widening coverage and reducing budget pull in OPPOSITE
    directions; under this change they pull in the SAME direction, which is what makes it a root-cause
    fix rather than another patch.

    For this defect class specifically: implement `symbol-anchored-citations.md` MUST-1 as a check in
    the existing gate, REUSING `derives-from-edge.js::classifyAnchor` rather than authoring a second
    anchor classifier; apply it corpus-wide; reduce the rule body to a pointer. Then the 18 anchors
    are caught by construction, and so is the next one.

    Generalise by applying ONE test to every clause in the corpus: is it mechanically decidable? If
    yes, it belongs in a gate and its scope should be universal. If it needs judgment, it has earned
    its context. At present both classes compete for the same rationed space, and the mechanical
    clauses are winning context they do not need while losing coverage they do.

  honest_cons: >-
    (1) A mechanical gate cannot express judgment-bearing clauses, so this drains only part of the
    corpus -- and MISCLASSIFYING a judgment clause as mechanical would silently weaken a real rule.
    The classification decision is the risk, not the implementation.

    (2) Gate code sits on the `self-referential-codify.md` Bin allowlist, so each change pays a
    Tier-1 multi-agent redteam. Higher unit cost than editing rule prose.

    (3) A check only fires where it is wired. This repo's `validate.yml` triggers on `push` and
    `pull_request` to main, so work landing by any other path is unprotected. That is the SAME
    class of gap as the original finding, one layer up, and it should be designed for rather than
    discovered later.

    (4) It does not reduce the corpus's total obligation surface -- it relocates enforcement. A
    reader looking only at rule prose will see LESS of the contract than is actually enforced, which
    is a new discoverability cost that the pointer-shrinkage must be written carefully to offset.

  confidence: >-
    HIGH, and materially higher than the block this supersedes. It rests on four facts re-derived
    against the tree this session -- the rule exists, its stated rationale matches the observed
    failure, its globs exclude all four defect directories (grep count zero), and the anchor
    classifier exists at a named symbol and line -- rather than on an inference about a file that
    could not be read from a consumer.

    REMAINING UNKNOWN, smaller than the prior block's but real: whether the emit gate can practically
    walk PROSE BODIES as well as structured edge records. `classifyAnchor` is invoked on edge-record
    anchors; whether it can be driven over arbitrary artifact prose without a redesign was NOT
    established here. Check this before implementation, exactly as the prior block's precondition
    demanded for its own step 2.

  acceptance_criteria:
    - "[ ] Gate-1 rules explicitly on which of the two root-cause blocks stands; the superseded recommendation is marked superseded rather than left to be reconciled by a later reader."
    - "[ ] PRECONDITION: someone confirms or refutes that the existing anchor classifier can be driven over prose bodies, not only edge records. Record the answer before implementation."
    - "[ ] symbol-anchored-citations.md MUST-1 is enforced by a mechanical check whose coverage includes .claude/{rules,skills,agents,commands}/** -- i.e. the four directories where the defect was measured."
    - "[ ] The check reuses derives-from-edge.js::classifyAnchor; no second anchor classifier is authored."
