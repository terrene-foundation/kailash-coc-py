capability_request:
  title: >-
    Consumer-authored rules have no delivery lane to Codex or Gemini — emission
    runs at loom from loom's corpus, and AGENTS.md/GEMINI.md are in the sync overlay
  submitted: 2026-08-02
  submitted_against_template_version: "1.20.0"
  upstream_loom_sha: c3791c19

  problem: >-
    In a downstream coc-project, a rule authored in .claude/rules/ reaches Claude
    Code only, and this is structural rather than staleness or misconfiguration.
    AGENTS.md and GEMINI.md are declared in the sync manifest's overlay `paths:`,
    annotated "Re-emitted on every loom /sync from .claude/rules/ via emit.mjs".
    They are emitted AT loom, FROM loom's corpus, and overwritten on every sync. A
    rule authored in a consumer repo is not in loom's corpus, so loom's emission
    structurally cannot contain it; emitting locally works until the next /sync
    replaces both files, because they sit in overlay `paths:` and not in
    `preserved:`.

  not_a_frontmatter_problem: >-
    Measured in one consumer with a positive control, so an absence could be
    distinguished from a broken search: two locally-authored rules carrying valid
    `priority: 0` / `scope: baseline` frontmatter appear ZERO times in AGENTS.md,
    while a template-supplied baseline rule appears FOUR times in the same file.
    Frontmatter was necessary and not sufficient.

  consequence: >-
    An operator working in Codex or Gemini runs without every rule their project
    has authored locally. In the observed consumer that included hook-enforced and
    ABSOLUTE-marked rules. Nothing reported it; the gap had been open at least
    eleven days before anyone asked directly whether codification reached the
    other CLIs.

  requested_change: >-
    A supported delivery lane for consumer-authored rules to the non-CC CLIs, in
    rough order of preference: (a) a LOCAL-RULES.md (or equivalent) placed in the
    manifest's `preserved:` set, which the per-CLI emitter APPENDS to its baseline
    output, so consumer content survives sync by construction rather than by
    re-running a step after every sync; or (b) a consumer-corpus hook in emit.mjs
    that reads the consumer's .claude/rules/ in addition to loom's, with headroom
    accounting extended to cover it. Either shape MUST fail loudly and by name
    when a consumer's local rules reach no lane, rather than emitting silently.

  headroom_constraint: >-
    Part of the ask, not an afterthought. In the observed consumer the emitted
    codex baseline sits close to its block cap while the unreached local rules are
    an order of magnitude larger than the remaining headroom. A lane therefore
    needs a SIZE answer (abridgement, skill-channel route, or a separate emitted
    file) rather than an append to the existing baseline.

  acceptance_criteria:
    - "[ ] A rule authored in a downstream coc-project's .claude/rules/ is reachable from Codex and Gemini after a /sync, without a manual post-sync step."
    - "[ ] The lane survives /sync — verified by running /sync and re-checking presence."
    - "[ ] A consumer whose local rules reach NO lane fails loudly and by name, rather than emitting silently."
    - "[ ] Headroom is accounted for the combined corpus; a breach fails closed rather than truncating."

  secondary_findings:
    - id: v14-masks-v15
      finding: >-
        Validator 14 (rule-frontmatter) fails closed on rules missing frontmatter,
        which is correct — but it exits before Validator 15 (tier-completeness), so
        a consumer that fixes frontmatter STILL cannot emit and only discovers the
        second wall after clearing the first.
      suggested_fix: >-
        Report both, or name V15 in V14's failure text. Saves a full cycle.
    - id: gitignore-reincludes-declared-not-applied
      finding: >-
        sync-manifest.yaml § gitignore_reincludes declares `!.claude/bin/lib/`, but
        a consumer whose .gitignore carries a bare `lib/` pattern (common in Python
        templates, for build artifacts) leaves the emitter's own modules untracked —
        so the emitter runs only in a long-lived checkout where the files happen to
        exist, and fails in CI and every fresh clone. The reinclude is declared but
        no step appears to apply it to the consumer's .gitignore.
      suggested_fix: >-
        Apply the reinclude, or assert it at sync time.

  reproduction: >-
    In any consumer: author a baseline rule locally with valid frontmatter, run
    /sync, and grep AGENTS.md for it — using a template-supplied rule as a positive
    control so an absence can be distinguished from a broken search.

status: pending_review
