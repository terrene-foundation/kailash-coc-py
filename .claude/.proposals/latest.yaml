    - "[ ] S4-3: no #L line-range anchor remains in .claude/**; each replaced anchor's target content is confirmed to contain what the citing text claims."
    - "[ ] S4-3: the path fix and the fragment fix for validate-workflow-structure.md:290 and error-parameter-validation.md:198 land in the SAME change; no anchor is promoted from dead to live-but-wrong."
    - "[ ] S4-4: the validator resolves fragments (heading-slug for #section, EOF bound for #L), OR its docstring states that exit 0 excludes fragments."
