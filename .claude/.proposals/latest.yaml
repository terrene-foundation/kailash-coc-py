    # ---- Cluster C — independent one-offs, different fix sites ----------------
    - id: 5
      cluster: C
      status: confirmed-scope-corrected
      where: ".claude/skills/30-claude-code-patterns/sync-flow.md § proposal schemas"
      finding: >-
        Neither upflow schema has a shape for a COC-artifact CAPABILITY GAP — a consumer
        reporting that something does not exist and asking loom to build it. Both model
        artifact CHANGES only, with a required `file:` and `diff_lines:`, and no `action:`
