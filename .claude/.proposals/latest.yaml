        membership via a tick-toggle model rather than a negative lookbehind, plus its own fence stripper)
        reproduced the validator's 105 as a MULTISET-IDENTICAL set -- same file:line:NNNN triples,
        JSON.stringify equality -- which is the strongest available validation that both matchers agree on
        members, not just totals. The orchestrator's unbackticked figure of 217 is bracketed at 214-220 by
        that instrument (fences stripped 214/55/85; fences kept 220/57/88), with the orchestrator's 55
        files and 85 distinct numbers matching `.claude/**` exactly. A residual 3 is UNRECONCILED and
