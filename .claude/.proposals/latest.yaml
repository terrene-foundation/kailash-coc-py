    - id: A7
      cluster: A
      status: LANE-REPORTED
      severity: LOW
      where: AGENTS.md and GEMINI.md (byte-identical)
      finding: The emitted baselines cite a use_excluded rule, so it dangles on both lanes.
      requested_fix: Apply use_exclude when emitting baseline bodies.

    - id: A8
      cluster: A
      status: VERIFIED-BY-ORCHESTRATOR
      severity: HIGH
      where: .codex/prompts/, .gemini/commands/, .coc/commands/ -- cross-repo-authorize
      finding: >-
        The CC source command became repo-class-aware (coc-source commits the authorization
        receipt; coc-use-template does NOT) and arrived here in the last Gate-2 sync. The three
        DERIVED trees did not re-emit and still carried the pre-fix UNCONDITIONAL step 5,
        "Commit the receipt for durable team audit", with a bare git add/commit block. This is a
        sync-completeness MUST-8 gap -- the source refreshed, the derived tree did not.
      evidence: >-
        0 VERSION::type references in all three derived files against 1 in the CC source (the
        control proving the matcher fires). Settled with git that the CC source was NOT
        hand-edited locally -- it last changed in the Gate-2 sync commit -- so the source is
        loom-current and the staleness is emitter-side.
      why_it_matters: >-
        A Codex or Gemini operator running the ceremony in a USE template is instructed to commit
        an operator-correlatable receipt (display_id, target org/repo, verbatim user instruction)
        into a repo that is a GitHub template clients clone, whose own git history is a
        distribution channel loom has no fence over. The emitter source names exactly this as how
        two BUILD repos came to track such receipts.
      local_disposition: >-
        Bridged locally by transplanting the source block verbatim into all three derived files.
        That bridge is Class-A and CONVERGES (the next emission produces the same content), but it
        is re-broken every cycle until the emitter re-emits the full derived tree.
      requested_fix: >-
        Re-emit the FULL derived tree on a source change, not just the scaffold. A source-vs-derived
        idempotency check at emit time would have caught this and A2/A3/A5/A6 as one class.

    - id: B1
      cluster: B
      status: VERIFIED-BY-ORCHESTRATOR
      severity: HIGH
      where: .claude/bin/sync-from-canon-fetch.mjs
      finding: >-
        Statically imports ./lib/loom-links.mjs, which is loom_only and absent from every USE
        consumer. Being a static top-level import it throws at LINK time, before any evaluation,
        so there is no guard and no degrade path.
      evidence: >-
        Importing the module fails with ERR_MODULE_NOT_FOUND naming the absent path; the control
        (a sibling bin script) loads OK, proving the probe can report success.
      why_it_matters: The script is 100% dead on every consumer -- it cannot run at all.
      requested_fix: >-
        Exclude the script from the USE lane, or convert to the guarded dynamic-import degrade
        pattern the sibling loom-doctor.mjs already uses correctly for the SAME module.
      note: >-
        loom-doctor.mjs imports the same absent module DYNAMICALLY inside a try/catch with a
        documented degrade and works correctly. The contrast is the fix.

    - id: B2
      cluster: B
      status: VERIFIED-BY-ORCHESTRATOR
      severity: HIGH
      where: rules/worktree-isolation.md and skills/30-claude-code-patterns/worktree-orchestration.md
      finding: >-
        Both instruct the agent to RUN bin/probe-ancestor-load.mjs, and both explicitly forbid
        re-deriving it ("the committed instrument -- do NOT re-derive it from prose"). The script
        is absent from the template and has zero manifest entries, so the absence is undeclared.
      evidence: >-
        The file is absent from .claude/bin/; sync-manifest.yaml matches it 0 times while the
        control term matches 32 times, so the grep fires and the zero is a true negative.
      why_it_matters: >-
        No legal action remains: the sanctioned path does not exist and the fallback is forbidden.
        Worse, the surrounding rule text says a non-zero exit means "ZERO evidence", so a
        MODULE_NOT_FOUND is primed to be misread as a substantive verdict about ancestor-loading.
        A RULE carries this, and it is path-scoped on globs consumers match routinely.
      requested_fix: Ship the script to consumers, or drop the run-instruction and the prohibition.

    - id: B3
      cluster: B
      status: VERIFIED-BY-ORCHESTRATOR
      severity: MEDIUM
      where: .claude/bin/emit-cli-artifacts.mjs
      finding: >-
        Shipped to consumers but cannot run in one. It halts on a missing .claude/variants/py/**
        overlay, which is loom-side and not distributed, reporting it as a manifest defect.
      why_it_matters: >-
        A consumer cannot re-emit its own derived trees. This is why A8 could only be bridged by
        hand rather than repaired properly.
      requested_fix: Exclude from the USE lane, or make the variants dependency optional there.

    - id: B4
      cluster: B
      status: VERIFIED-BY-ORCHESTRATOR
      severity: MEDIUM
      where: .claude/bin/validate-xref-integrity.mjs
      finding: >-
        The template ships a cross-reference validator that EXITS 1 on the shipped template
        itself, and no workflow runs it. That is why corpus drift accumulated unnoticed.
      evidence: >-
        Exit 1 with 294 dangling rows after this session's CLAUDE.md repair (298 before). No
        workflow references it; the control confirms the grep matches the workflow directory.
      why_it_matters: >-
        A validator that is red by construction cannot be wired into CI, so the drift it is meant
        to catch goes uncaught on 30+ consumers.
      requested_fix: >-
        Teach the validator its by-design-absent categories (loom_only tooling, journal/, tier
        artifacts a consumer does not subscribe to) so a clean consumer checkout exits 0, THEN
        wire it. Do NOT wire it first -- roughly 218 of the 294 rows are legitimate absences,
        so it would red the board permanently and be disabled.

    - id: C1
      cluster: C
      status: VERIFIED-BY-ORCHESTRATOR
      severity: HIGH
      where: .claude/hooks/session-end.js
      finding: >-
        The hook requires ../learning/digest-builder, which does not exist at that path (the real
        file lives under scripts/). The require sits inside an EMPTY catch, so the failure is
        swallowed, and the hook then returns its success string -- which includes the words
        "learning digest built" -- UNCONDITIONALLY. It reports building a digest it never built.
        There is a second break in the same chain: the real digest-builder itself requires a
        learning-utils path that resolves under scripts/hooks/, also absent, a tree the
        .coc-obsoleted list purges. Repointing only the first require surfaces the second.
      evidence: >-
        Requiring the module throws MODULE_NOT_FOUND; the control (a module that does exist)
        resolves, proving the probe reports success when success is real. The success string is
        emitted from an unconditional return.
      why_it_matters: >-
        /codify consumes the digest that is never produced, and the empty catch guarantees no
        consumer ever learns why. This is the template violating its OWN zero-tolerance Rule 3
        (empty catch, error hiding) and Rule 2 (reporting work not performed) in shipped code.
      requested_fix: >-
        Repoint BOTH requires, replace the empty catch with a logged failure, and make the success
        string conditional on the digest actually being written.

    - id: C2
      cluster: C
      status: VERIFIED-BY-ORCHESTRATOR
      severity: MEDIUM
      where: 8 prose occurrences across 4 command surfaces + 2 code sites in bin/cross-repo-authorize.mjs
      finding: >-
        Documentation states the cross-repo receipt guard greps the working tree "within an mtime
        window". The guard explicitly repudiates mtime -- its own comment says age comes from the
        receipt's timestamp:/date: FRONTMATTER, NOT filesystem mtime, because git rewrites mtime on
        checkout, worktree-add and clone -- and it applies a 6-hour window over that frontmatter.
        A separate claim in the same comment, that "receipts are COMMITTED", is now false for every
        non-coc-source repo class under the corrected guidance.
      why_it_matters: >-
        An operator reasoning about receipt validity from these docs reasons from a false model. It
        also caused a real misdiagnosis this session: a receipt was believed live when it had in
        fact expired two days earlier, making an "enforcement preserved" check true but vacuous.
      requested_fix: >-
        Replace "mtime window" with "6-hour receipt-timestamp window" across the source command and
        both code sites, and repair the "receipts are COMMITTED" clause.
      deliberately_not_fixed_locally: >-
        Correcting only the derived trees would create the source-vs-derived divergence A8 is about,
        so the false text was transplanted VERBATIM on purpose. This must be fixed at the source.

    - id: D1
      cluster: D
      status: LANE-REPORTED
      severity: MEDIUM
      where: 5 files tracked in git AND listed in .claude/.coc-obsoleted
      finding: >-
        Five files are distributed while simultaneously appearing on the list that downstream
        /sync-from-template reads as a DELETE list. New clones receive them; syncing clones lose
        them, so behaviour diverges by clone age. The manifest confirms purge intent for at least
        two of them.
      why_it_matters: >-
        One of the five is emit-dev-container.mjs, which is load-bearing for the dev-container
        deliverable -- worth confirming that purge is intended rather than collateral.
      requested_fix: Reconcile the shipped set against .coc-obsoleted in one direction or the other.

    - id: D2
      cluster: D
      status: LANE-REPORTED
      severity: HIGH
      where: .claude/skills/18-security-patterns/SKILL.md -- the Reference Documentation section
      finding: >-
        All EIGHT entries in the skill's reference index are absent repo-wide. The directory holds
        eleven files under entirely different names. Unlike the off-by-one class below, no path
        correction resolves these -- the index was never reconciled to the file set.
      why_it_matters: The security skill's own table of contents dead-ends on every lookup.
      requested_fix: Regenerate the index from the directory contents.

    - id: D3
      cluster: D
      status: LANE-REPORTED
      severity: MEDIUM
      where: Kailash domain skills -- roughly 55 relative links
      finding: >-
        Targets EXIST; the paths are wrong. Four sub-shapes: one ../ too many; a missing numeric
        directory prefix; a redundant re-rooting that yields .claude/.claude/; and a four-level
        escape that leaves the repo entirely.
      requested_fix: Mechanical path correction; all intended targets were confirmed to exist.

    - id: D4
      cluster: D
      status: LANE-REPORTED
      severity: MEDIUM
      where: .claude/skills/project/ -- four files
      finding: >-
        Four CC-only skills undeclared in every exclusion stanza. Three are superseded duplicates
        whose canonical homes reach all three lanes, and the copies have DIVERGED from those
        canonical versions. The fourth has no counterpart anywhere and zero manifest mentions.
        This is an ORPHAN-EMISSION defect -- CC is the wrong lane here, not the deprived one.
      requested_fix: Delete the three diverged duplicates; declare or relocate the orphan.

    - id: D5
      cluster: D
      status: VERIFIED-BY-ORCHESTRATOR
      severity: MEDIUM
      where: sync-manifest.yaml gitignore_additions
      finding: >-
        Extends item 10 of the prior block, which covered ONE path. FOUR sibling per-operator paths
        are also absent from gitignore_additions, and shipped artifacts already ASSERT that they are
        gitignored: a hooks library WRITES a header reading "(gitignored, regenerable)" into one of
        them, and three separate artifacts describe the per-operator local-links file as
        "gitignored-per-operator", one of them naming the harm as being "one git add -A away from the
        synced surface". Those local-links files carry operator-absolute cross-repo paths.
      requested_fix: >-
        Add the aggregate session-notes view, the per-operator *.local.json files, the transient
        migration leftover, and the nested-worktree directory to the visibility-scoped
        gitignore_additions alongside item 10's path.
      local_disposition: >-
        Fixed locally this session, which is durable because gitignore_additions is additive and
        must not remove operator-managed lines. Consumers that never receive this fix stay exposed.

  acceptance_criteria:
    - "[ ] A1: burn-down-reporting.md appears in the rules-reference index for BOTH non-CC lanes, or its exclusion is declared in cli_emit_exclusions."
    - "[ ] A1/A6: the index generator is driven by the cli_delivery declaration and by use_exclude, so a new skill-channel rule is indexed automatically and an excluded rule is not."
    - "[ ] A2/A3: agent and command citations resolve on the lane they are emitted to; a re-run of the citation-resolution sweep returns zero dangling on .codex/ and .gemini/."
    - "[ ] A8: a source-vs-derived idempotency check runs at emit time and is non-empty ONLY when the source changed; re-running emit after a source change produces no diff."
    - "[ ] B1: sync-from-canon-fetch.mjs either imports nothing absent on the USE lane, or is excluded from it; importing it on a clean consumer checkout no longer throws."
    - "[ ] B2: bin/probe-ancestor-load.mjs is present on consumers, OR both the run-instruction and the do-not-re-derive prohibition are removed."
    - "[ ] B4: validate-xref-integrity.mjs exits 0 on a clean consumer checkout BEFORE any CI wiring is added."
    - "[ ] C1: session-end.js writes the digest or reports failure; the success string is never emitted when the digest was not built, and the empty catch is gone."
    - "[ ] C2: no artifact states the receipt guard uses an mtime window; the corrected 6-hour receipt-timestamp wording appears in the source command AND both code sites."
    - "[ ] D2: every entry in the security skill's reference index resolves to an existing file."
    - "[ ] D5: all five per-operator paths appear in the visibility-scoped gitignore_additions."

  disclosure_scrub: >-
    Every path here is on the .claude/ artifact surface. No operator identity, no absolute path, no
    client or tenant identifier, and no downstream-consumer name appears in this block
    (upstream-issue-hygiene MUST-2, knowledge-cascade-routing MUST-3). The one place an operator
    display_id was in scope -- A8's description of what a committed receipt exposes -- is described
    by FIELD NAME rather than by value.

  known_coverage_gaps: >-
    Stated so this block is not read as a complete audit. Per-file BODY parity across the 407
    co-present skills was never diffed -- only file-set membership and citation resolution -- so the
    cross_cli_drift_audit axis remains entirely untested and that half of the multi-CLI clause is
    still OPEN. Also unaudited: hook and config parity across lanes, the .coc/ tree's own membership,
    guides/, bin/, templates/, and section-anchor resolution (a link may resolve to a real file whose
    named section is gone). Container-side execution was never exercised -- hook verification was
    host-side only, so the container-parity clause of the brief is NOT closed. The A2/A3 counts are
    LOWER BOUNDS.

use_template_findings_body_parity_and_coc_lane:
  header: >-
    Session 3 (2026-08-07). This block CLOSES the two axes the preceding
    use_template_findings_multi_cli_audit block explicitly left open in its own known_coverage_gaps:
    (a) per-file BODY parity across the co-present artifact set, which it recorded as "entirely
    untested", and (b) container-side hook execution, which it recorded as "never exercised". Both
    were swept this session. It also sweeps a FOURTH lane -- .coc/ -- that no prior block scoped at
    all, and that lane turned out to carry the most serious defects found.

    EVERY item is labelled VERIFIED-BY-ORCHESTRATOR (re-derived independently by the orchestrator
    with controls fired in both directions) or LANE-REPORTED (an audit lane's result the orchestrator
    did not fully re-derive). RESPECT THE LABEL: the second class is a lead to confirm, not
    established fact. This is the same discipline the preceding block used.

    Method note that bears on how to read the counts below. Every finding here survived an
    adversarial refutation round in which no lane reviewed its own work. That round CHANGED the
    disposition of three items and REDUCED the severity of one by roughly 8x. Where a claim was
    revised, both the original and the correction are recorded rather than the correction alone --
    the revisions are the most useful signal in this block.

  what_the_adversarial_round_changed: >-
    Recorded because a Gate-1 reader should see which claims moved under attack.

    (1) A dangling-reference finding was originally filed as "17 rewrite-induced broken references".
    Refuted: 16 of 18 resolve to an artifact that EXISTS on that lane under its native name (Gemini
    commands are .toml not .md; Codex agents live at prompts/specialist-<n>.md not agents/; Gemini
    agents are flat, not nested). GENUINELY absent: 2. Correct framing is "true as a PATH claim,
    misleading as an AVAILABILITY claim". A broken pointer is still a defect -- an agent following
    the literal path fails -- but the remedy and severity differ from "missing capability".

    (2) A worktree --force finding was originally filed as "the emitter INVERTED the guidance".
    Refuted: it is STALENESS. At the last regeneration both lanes carried the byte-identical
    sentence; CC changed afterwards. The derived lanes are a faithful copy of CC's own former text.

    (3) A rules-softening finding was originally filed as "the softening never propagated", implying
    oversight. Refuted: sync-manifest.yaml::use_softenings is a DELIBERATE, documented USE-lane
    transform. Reframed below as a DECISION for the human, not a defect.

    (4) A container depth metric was originally presented in a container-parity frame. Refuted by
    the measuring lane itself: it measures IDENTICALLY on the host. Reattributed below.

    A fifth, softer lesson: on TWO independent surfaces, a regex-over-prose sweep overstated genuine
    defects by ~8x (17 vs 2 on one lane; 95 vs 12 on another). That is a property of the INSTRUMENT
    CLASS, not of either lane -- a path-shaped string in prose cannot be distinguished from a
    reference by a matcher. Both false-positive sets included a path inside an explicit
    "do NOT create this file" instruction, counted as a broken link TO that file.

  findings:
    - id: S3-1
      title: One missed regeneration accounts for FOUR apparent drift findings
      evidence_class: VERIFIED-BY-ORCHESTRATOR
      severity: HIGH
      finding: >-
        The derived lanes were last regenerated at commit 537ab6f (2026-08-02). Two CC changes landed
        together in 156c08c (2026-08-04) and never reached them. This single delta explains four
        separately-observed defects, and the upstream remedy is ONE action, not four.

        (a) instrument-discipline.md MUST-3 ("Show The Instrument Fires HERE, And Read The Hits") is
        ENTIRELY ABSENT from both emitted baselines. Orchestrator grep: 1 in the CC source, 0 in each
        baseline; control matcher on a sibling MUST clause returns 1 in all three, so the matcher
        works against the baselines. This is NOT sanctioned abridgement -- the manifest's
        abridgement_protocol mandates preserve "MUST / MUST NOT clauses in full", and the clause is a
        level-3 heading, outside the level-4+ strip.

        (b) worktree.md --force guidance. CC now reads "never --force ... confirming a clean tree and
        THEN forcing is the check-then-clobber TOCTOU ... unstaged + untracked-not-ignored work has
        NO reflog". Both derived lanes read "add --force only after confirming a clean tree" -- the
        exact practice CC names as blocked, on an operation whose loss is unrecoverable. NOTHING on
        those lanes restores the prohibition (grep across both derived trees and both baselines
        returns empty; the same grep on the CC tree hits).

        (c) sweep.md: the worktree reap-audit contract (verdict vocabulary, the sentinel, the
        --force prohibition) is absent from the derived lanes, which retain an older paragraph naming
        a different tool.

        (d) codify.md: the lease-takeover paragraph is absent from the derived lanes.
      verification: >-
        Orchestrator confirmed both derived surfaces pin to 537ab6f and both CC changes landed in
        156c08c, by direct git log on each path. The --force wording was read verbatim on all three
        lanes.
      honest_counter_not_defeated: >-
        CC itself shipped the weaker --force guidance from 2026-07-11 to 2026-08-04, across multiple
        syncs. "The derived lanes are wrong" and "CC was wrong until four days ago" are the same
        sentence at different times. The accurate upstream claim is "the derived lanes are stale",
        NOT "the emitter inverted the guidance".
      requested_fix: >-
        Regenerate the derived lanes from current CC source. Verify afterwards that MUST-3 is present
        in both baselines and that the --force prohibition reaches all lanes.

    - id: S3-2
      title: The shipped .coc/ set FAILS ITS OWN INTEGRITY GATE and refuses to inject
      evidence_class: VERIFIED-BY-ORCHESTRATOR
      severity: HIGH
      finding: >-
        Running the shipped launcher in dry-run mode exits 1 with:
        "integrity: hash mismatch for commands/CROSS-REPO-AUTHORIZE.md ... the .coc/ set is tampered
        or partially written -- refusing to inject". A consumer relying on the .coc/ lane via the
        reference launcher is HARD-BLOCKED unless it passes --no-verify-lock, which disables the
        integrity check wholesale.

        Root cause is committed drift, not a local edit: COC.lock was last written by the Gate-2 sync
        at 537ab6f, where the file's hash matches the lock exactly. Two later commits each edited
        .coc/commands/CROSS-REPO-AUTHORIZE.md alongside its per-CLI twins, and neither updated
        COC.lock. Membership is otherwise complete (0 in-lock-missing-on-disk, 0 on-disk-not-in-lock);
        exactly ONE hash mismatch exists.
      verification: >-
        Orchestrator ran the launcher and captured exit 1 -- re-measured WITHOUT a pipe after an
        initial attempt read the exit status of a downstream pager rather than the launcher.
        Independent SHA-256 recompute of the file matches the lane's reported digest and differs from
        the lock's recorded digest. Both poles controlled by the reporting lane: rebuilding the lock
        from actual bytes yields exit 0, and then tampering one byte in an unrelated file yields exit
        1 naming that file -- so the verifier genuinely discriminates.
      requested_fix: >-
        Regenerate COC.lock, and gate future edits to .coc/** on a lock refresh so an edit cannot
        land without it. The two commits that introduced the drift each touched three files and the
        lock was absent from both -- a paired-landing check would have caught it.

    - id: S3-3
      title: .coc/ BYPASSES the USE-tier exclusion fence that every other lane honours
      evidence_class: VERIFIED-BY-ORCHESTRATOR
      severity: HIGH
      finding: >-
        Five artifacts declared use_exclude / use_obsoleted in the manifest are ABSENT from the CC
        lane and from both per-CLI lanes, but PRESENT in .coc/: two BUILD-internal rules, one
        obsoleted rule, and a harness-orchestration command plus its skill. The manifest's stated
        rationale for excluding them is that consumers do not run them. The .coc/ lane describes
        itself as the consumer-facing unified artifact set, so this delivers BUILD-only material to
        exactly the audience the fence exists to protect.

        This is SELECTIVE, not a blanket failure: other use_exclude entries ARE correctly fenced on
        .coc/, and a control entry present everywhere behaves correctly.

        Sharpest instance -- a rule whose distribution claim its own repository falsifies. A shipped
        rule asserts verbatim that the harness command "is use_exclude'd (absent at USE-template and
        downstream)", while that command sits in this USE template on the .coc/ lane at 5,531 bytes.
      verification: >-
        Triangulated across three independent sources. Two audit lanes converged on it separately.
        The orchestrator then closed the sibling-lane question both lanes had flagged as unmeasured:
        the per-CLI lanes correctly fence all four probe artifacts, and the excluded rule's content
        returns 0 in both emitted baselines (control: 45 hits in the .coc/ copy, so the matcher
        fires). Fence declarations confirmed at their manifest line numbers under a firing control.
      requested_fix: >-
        Apply the USE-tier exclusion fence to .coc/ emission. Then re-run the fence across all
        eleven use_exclude entries -- only six were tested against .coc/, so the five-artifact count
        is a FLOOR, not a full count.

    - id: S3-4
      title: tools/ is an UNMANAGED directory; the drift-audit executor never had a delivery path
      evidence_class: VERIFIED-BY-ORCHESTRATOR
      severity: MEDIUM
      finding: >-
        tools/ has ZERO mentions in sync-manifest.yaml -- it is in no tier, and is neither
        distributed nor declared loom-only. It arrived exactly once, in the original adopt commit
        (2026-05-06), and no sync has touched it since; control: the rules tree shows 66 commits over
        the same span, so the query discriminates.

        Consequence: tools/cli-drift-audit.mjs, which the parity contract names as the executor for
        the cross-CLI drift verb, landed upstream 2026-05-14 -- eight days AFTER the only delivery
        event -- and therefore never had a path to this template. Its acceptance fixtures DID arrive,
        because the fixtures directory IS in a tier. Fixtures ship; the executor does not.

        A related distribution inconsistency: the cli-audit COMMAND was correctly moved to loom-only
        in a 2026-06-23 leak fix and purged from all three lanes, but the cli-orchestrator AGENT that
        exists to serve it was only added to the per-CLI exclusion lists for the two non-CC lanes --
        never to loom-only -- so it still ships to CC consumers. The manifest's own rationale for
        those exclusions calls it a "loom AUTHORING agent ... NOT a downstream specialist". The net
        effect on a CC consumer is a live agent in the roster advertising a command that does not
        exist locally and instructing a tool that cannot arrive.
      verification: >-
        Confirmed 5/5 claims under adversarial attack. The strongest counter was built and defeated:
        tier entries are .claude/-relative, so a tools/** entry would mean .claude/tools/ and the
        absence would be structurally unfixable rather than an omission. That counter fails because
        the manifest DOES address repo-root paths elsewhere (repo-root script paths appear in its
        purge sections) and because sync demonstrably reaches repo-root (a later sync touched a
        sibling root directory). Commit counts across root siblings: two other root directories have
        4 commits each; tools/ has 1. It is the only repo-root sibling a later sync never revisited.
      residual_not_closed: >-
        The force-ship include list could not be enumerated from a consumer clone -- the tier-
        selection engine does not ship here and reading upstream is out of scope. The claim is
        therefore PROVEN for tier-based delivery and only CORROBORATED (one-directionally, by git
        history) for force-ship.
      requested_fix: >-
        Declare tools/ explicitly -- either in a tier so it cascades and stays current, or as
        loom-only so its absence is intentional and greppable. Either resolves it; silence does not.
        Separately, move the cli-orchestrator agent to loom-only to match its own command.

    - id: S3-5
      title: A DATED pipeline regression rewrote canonicity claims on both derived lanes
      evidence_class: VERIFIED-BY-ORCHESTRATOR
      severity: MEDIUM
      finding: >-
        Two shipped skills tell their reader where the canonical source lives, and on the derived
        lanes the path in that sentence was rewritten to point at the derived tree itself.

        skill-authoring: CC correctly reads ".claude/skills/<name>/SKILL.md is the canonical source".
        The Codex copy names the Codex tree; the Gemini copy names the Gemini tree. Both are false --
        those trees are regenerated and marked do-not-edit.

        command-authoring: CC correctly reads "The authoritative copy lives at
        .claude/commands/<name>.md". The Gemini copy names a path that exists in NO form (those
        commands are .toml). The Codex copy names the emitter's OWN OUTPUT, named two clauses later
        in the same paragraph -- self-contradictory on its own lane.

        Net effect: the two skills that teach artifact authoring instruct two of three audiences to
        author into a tree the next sync overwrites.
      verification: >-
        Provenance SETTLED, which the originating pass could not do. This is sync-pipeline-generated,
        not hand-edited: at 8eb9b0b (2026-05-13) the derived lane was CORRECT; at db2d50f
        (2026-05-15, a loom-distribution sync) it was rewritten, and that commit's stat for the CC
        source file is EMPTY. A sync commit changed derived text without touching its source, which a
        hand-edit cannot produce. Orchestrator confirmed both the empty CC stat and the known-good
        predecessor content directly. The identical pattern appears in the second skill at the SAME
        commit.

        This is therefore a SINGLE DATED PIPELINE EVENT with a known-good predecessor state, not a
        standing property of the emitter -- materially more actionable. Note the predecessor commit
        was itself an overlay-regression repair, so this class has recurred before.
      honest_counter_not_defeated: >-
        In a USE template the CC tree is ALSO derived (the true canon is upstream), so "canonical" is
        frame-relative and the CC sentence is itself imprecise. This does not rescue the derived
        statement -- naming the derived tree is false in every frame -- but it suggests the cleanest
        fix is to STOP REWRITING this sentence rather than to restore the CC path.
      requested_fix: >-
        Exempt canonicity-asserting sentences from lane-root path rewriting. The predecessor commit
        provides a known-good reference for what the emission should produce.

    - id: S3-6
      title: .coc/ carries GENUINE SOURCE DIVERGENCE (not staleness) plus a dropped MUST clause
      evidence_class: LANE-REPORTED
      severity: MEDIUM
      finding: >-
        Distinct from S3-1, and the distinction matters for the remedy. The CC rules softening landed
        2026-07-19; .coc/ was emitted 2026-08-02 -- two weeks LATER -- and still carries the old
        pre-softening text. It cannot be explained by staleness the way S3-1 can, and REGENERATION
        ALONE WILL NOT FIX IT: the emitter is reading a different, older source than .claude/ does.

        FULL BODY-TEXT sweep (superseding the heading-level pass this item originally rested on):
        193 co-present pairs compared in full, 184 byte-identical after normalizing frontmatter and
        CC-only slot markers. NINE genuine drifts -- SIX staleness (CC changed 2026-08-04, .coc/
        untouched; remedy = regenerate) and THREE SOURCE DIVERGENCE on rules/agents,
        rules/zero-tolerance and rules/testing.

        The DIRECTION of the three is the alarming part: .coc/ ships a HARDER normative contract than
        the CC source authorizes. MUST/BLOCKED token counts run NEGATIVE (.coc/ carries MORE):
        agents -4, zero-tolerance -2, testing -1. Example -- CC rules/testing reads "Tier 2: Real
        infrastructure recommended (mocking discouraged)" while .coc/ reads "Tier 2: Real
        infrastructure. NO mocking (@patch, MagicMock, unittest.mock -- BLOCKED)".

        Classification instrument, both branches falsifiable: each .coc/ file was compared against
        `git show <emission-sha>:.claude/<path>` -- the CC source AS IT STOOD AT EMISSION. If
        staleness, .coc/ == CC-at-emission exactly; if source divergence, it differs even then. The
        three above differ even then. No variants/ directory exists in this repo, so no overlay
        explains it; the .coc/ text most closely matches a CC revision from 2026-07-12, i.e. a
        roughly three-week-stale upstream vintage.

        Skills were also swept, which a prior pass had declined: COC.md § Layout declares one file
        per skill as "the SKILL.md entry point", so entry-point-to-entry-point IS the contract-sound
        comparison. Result: 41/41 identical, zero drift. Non-entry-point sibling files are outside
        .coc/'s declared contract and are not a denominator.

        Also on this lane: a variant-only agent deployed in this template is absent from .coc/ --
        structurally explained (it is `variant_only: py` with no global source, so the .coc/ composer
        never sees it) but still a real gap, since a py-only agent that ships to .claude/ never
        reaches the CLI-neutral set. And 1135 path-bearing references were classified with ZERO
        intra-set resolution, the largest class (686) being a lowercase-reference-vs-uppercase-
        filename mismatch.

      CORRECTION_to_this_item_as_first_filed: >-
        Recorded rather than silently amended, because the error is instructive and this block's
        whole method is that revisions are the most useful signal.

        This item originally asserted that a zero-tolerance sub-rule (Rule 1d) is ENTIRELY ABSENT
        from .coc/, and that its absence is an abridgement-protocol violation. BOTH HALVES ARE FALSE
        and are withdrawn.

        (1) Rule 1d is PRESENT in .coc/. Verified by the orchestrator: it sits at .coc/ line 52 and
        CC line 53, and BOTH files carry exactly 9 level-3 headings. The only difference is the
        heading TEXT -- CC "Enumerated Classes Stay Strongly Recommended" vs .coc/ "Enumerated
        Classes Stay ABSOLUTE". A heading-set comparison keyed on exact string reported a RENAMED
        heading as a DELETED one. The clause is therefore an INSTANCE of the source-divergence class
        above, not an absence.

        (2) The abridgement protocol DOES NOT APPLY to .coc/ at all, so no .coc/ difference can be a
        protocol violation. The protocol is nested under the Codex `project_doc` byte-cap config
        (`override_flag_required: "-c project_doc_max_bytes=65536"`) and governs the single
        concatenated root baseline. .coc/ is one file per artifact with no byte cap. Falsifying test,
        both poles fired: `Origin:` lines and `BLOCKED rationalizations:` sub-lists are both
        `strip_sections` entries -- .coc/ RETAINS them (52 and 54 files respectively) while the
        emitted baseline carries ZERO of each. .coc/ is demonstrably not abridged.

        Consequence for any re-derivation: there is no "sanctioned abridgement" rejection class on
        the .coc/ surface. Every prose difference there is a candidate, and a reviewer who dismisses
        one as licensed abridgement is applying a contract that does not reach this lane.
      verification: >-
        Orchestrator verified the .coc/ lane's two drifted rule texts and the USE-fence leak
        (S3-3) directly, but did NOT re-derive the reference counts or the agent-enumeration claim.
        Two absences on this lane were correctly scored Not-Run rather than Fail, because both
        clauses postdate emission -- they did not exist when .coc/ was generated, so their absence is
        staleness awaiting regeneration and not drift. (The original wording justified Not-Run on the
        ground that the clauses "cannot have been stripped", which appealed to the abridgement
        protocol; per the CORRECTION below that protocol does not govern this lane, so the verdict
        stands but the reasoning is replaced.)
      instrument_note_worth_carrying: >-
        The reporting lane resolved paths by exact-case directory comparison rather than a filesystem
        existence check: on a case-INSENSITIVE filesystem a naive existence check reports the
        686-reference class as fully resolving and misses the defect entirely, while the same
        references break on every case-SENSITIVE consumer. Any upstream re-derivation must therefore
        use exact-case comparison rather than a bare existence check, or it will reproduce a clean
        result that carries no information.
      requested_fix: >-
        Regenerate .coc/ from current source; restore the dropped MUST clause; include variant-only
        deployed agents in .coc/ enumeration. The intra-set reference convention needs a decision --
        the adjudicating contract is external and was not available to this repo, so the lane
        reported the observed non-resolution WITHOUT asserting a spec violation.

    - id: S3-7
      title: Small genuine breaks confirmed after severity correction
      evidence_class: MIXED -- see per-item labels
      severity: LOW
      finding: >-
        (a) VERIFIED-BY-ORCHESTRATOR. Two references to a CC-only agent were rewritten onto both
        derived lanes, where it exists on neither -- and the Gemini copy points at a CODEX-specific
        architect. These are the 2 genuine breaks that survived the 17-to-2 severity correction.

        (b) LANE-REPORTED. Twelve genuine CC-side broken references out of 95 raw candidates: stale
        skill paths in a shipped README, a markdown link with both halves wrong, six flat agent paths
        from a superseded layout in a plan document, and a present-tense assertion of a fixtures
        directory that does not exist. These are CC-side, so the emitter propagates them FAITHFULLY
        to all lanes -- one CC fix repairs every lane at once, which makes them higher-leverage than
        anything lane-specific here.

        (c) LANE-REPORTED. An orphaned 17,830-byte companion guide whose rule is correctly
        use_exclude'd -- the fence took the rule but not its guide. The machinery handled 2 of 3 such
        pairs correctly and leaked once.

        (d) VERIFIED-BY-ORCHESTRATOR. One baseline rule cites a companion guide that does not ship
        here. Precisely bounded: 26 rule/guide pairs intact, exactly 1 broken. Both control poles
        fired.

        (e) VERIFIED-BY-ORCHESTRATOR. GH_TOKEN / GITHUB_TOKEN appear ZERO times in the shipped
        .env.example, so the documented consumer path leaves the GitHub CLI unauthenticated inside
