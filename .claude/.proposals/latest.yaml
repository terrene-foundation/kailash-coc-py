    - id: 2
      cluster: C
      status: confirmed-reproduced
      where: ".claude/commands/sweep.md — Sweep-9 pre-condition gate"
      finding: >-
        The gate dynamically imports .claude/bin/lib/loom-links.mjs and attaches .catch() to the
        import promise chain, so a module-resolution failure and a genuine resolver error land in
        the same handler and both emit the ERROR sentinel. The N/A sentinel lives inside .then()
        and is unreachable when the import itself rejects. Because the command's own text states
        that an ERROR sentinel "is itself a finding", every consumer lacking the module reports a
        false finding on every /sweep run.
      evidence: >-
        REPRODUCED in this repo — running the gate verbatim emits
        "<!-- sweep-ecosystem:v1:ERROR reason=Cannot find module ... -->". Note the process exits
        0, so the exit code cannot discriminate; only the emitted sentinel string can. The module
        is absent BY DESIGN, not by accident: sync-manifest.yaml fences bin/lib/loom-links.mjs as
        loom_only ("a consumer resolves nothing cross-repo"), which SUPPRESSES future emission —
        and the already-distributed USE-template copy is purged by the `use_obsoleted:` twin. The
        `obsoleted:` entry is NOT the USE-lane mechanism: it sits under a BUILD-lane header and
        purges the BUILD copy only. TWO drafts got this wrong in OPPOSITE directions — the first
        attributed the USE-lane absence to the BUILD-lane `obsoleted:` entry; the correction then
        over-swung to "NOT an obsoleted: purge entry", which reads as "no purge entry covers the
        USE lane" and is equally false. Both `loom_only` AND `use_obsoleted` cover the USE lane, in
        complementary roles (the manifest states the split explicitly: sync-tier-aware.mjs reads
        `obsoleted` on the BUILD lane and `use_obsoleted` on the USE lane). So the
        intended N/A case is precisely the case that produces ERROR.
      scope: >-
        Fires on all 30+ consumers, on every run. NOT merely noise — there is a disclosure
        dimension an earlier draft of this item missed. The ERROR sentinel embeds the failed
        module's ABSOLUTE path, which on any consumer is an operator home path. sweep.md itself
        says the ERROR sentinel "is itself a finding — surface it", and the command's Closure
        step commits the report; the same command separately requires scrubbing operator-absolute
        paths before committing. So every /sweep run on every consumer manufactures a
        path-bearing sentinel that the command then instructs the agent to roll into a committed
        artifact, defended only by a judgment-level scrub (user-flow-validation.md MUST-6). The
        N/A fix removes the sentinel — and with it the recurring scrub obligation — at the source.
      self_referential_gate: >-
        commands/sweep.md IS on the self-referential-codify.md Rule-2 allowlist as a LIVE firing
        entry (backticked, depth-0, between redteam.md and wrapup.md), so the fix needs the
        Tier-1 multi-agent gate.
      requested_fix: >-
        Discriminate ERR_MODULE_NOT_FOUND from a genuine resolver error and emit the N/A sentinel
        for the former, keeping ERROR for the latter.

