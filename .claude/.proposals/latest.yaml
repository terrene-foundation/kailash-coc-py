        .gitignore, and not what a /sweep cleans — scoped here so the sentence is airtight)
        and specifically zero anywhere
        under .claude/, and zero are tracked in the index.
      evidence: >-
        `git check-ignore -q` exit codes with controls on both poles: root .DS_Store exits 0
        (known-ignored control), README.md exits 1 (known-not-ignored control), the
        audit-fixtures paths exit 1 (NOT ignored — defect confirmed), and all three lib/ paths
        exit 0 (still ignored — sibling half refuted). INSTRUMENT WARNING, stated precisely
        because an earlier draft of this note was itself a trap: `check-ignore -v` cannot
        discriminate here AT ALL — not by its output (it prints a matching line for NEGATED paths
        too) and not by its exit code (measured: `-v` exits 0 on a re-included path while plain
        `-q` exits 1 on the same path). The earlier wording said "only the exit code
        distinguishes", which reads as "run -v and trust its exit code" and yields the OPPOSITE
        verdict. Use plain / `-q` and read the exit code; `-v` is for locating the matching rule
        only, never for deciding whether a path is ignored.
      requested_fix: >-
        Re-exclude the OS-metadata pattern after the negation, e.g. add
        `.claude/audit-fixtures/**/.DS_Store` following the line-122 negation. Do NOT apply the
        same change to the three lib/ negations — they do not have the defect.
      fix_must_render_AFTER_the_negation: >-
        CRITICAL MECHANISM CONSTRAINT — do NOT route this through `gitignore_additions`.
        Render order inside the single managed block is gitignore_additions ->
        visibility_gitignore_additions -> gitignore_reincludes, and the negation is the LAST
        line the block emits. Git is last-match-wins, so a re-exclusion inserted via
        `gitignore_additions` lands BEFORE the negation and is overridden — it would ship a
        change that silently does nothing. Verified by direct A/B test: with the re-exclusion
        BEFORE the negation the path is still NOT ignored; with it AFTER, the path IS ignored;
        control with no fix reproduces the defect. The fix therefore needs a mechanism that
        renders AFTER `gitignore_reincludes` — either a new post-reinclude slot or an explicit
        ordering guarantee.
      do_not_narrow_the_negation: >-
        Also do NOT "fix" this by narrowing the `/**` to the siblings' trailing-slash form.
        The two forms rescue against DIFFERENT consumer ignore shapes: against a file-glob
        ignore (`*.json`) only `/**` rescues the fixtures; against a directory-form ignore
        (`audit-fixtures/`) only the trailing slash does. The `/**` is load-bearing.

    - id: 10
      cluster: B
      status: confirmed-new
      new_since_issue_55: true
      where: ".gitignore managed block / sync-manifest.yaml § visibility_gitignore_additions.public"
      finding: >-
        Two per-operator local-state paths are NOT covered by the ignore rules, so a `git add -A`
        commits operator-local content to a tracked surface. This is the same class as item 4 —
        gitignore coverage gaps in the loom-managed block — but a different and more consequential
        failure mode: item 4 admits OS noise, this one admits per-operator session state.
      instance_a: >-
        `.session-notes.migrated` is NOT ignored. .gitignore covers `.session-notes` (lines 56 and
        114), `.session-notes.d/` (115) and `.session-notes.shared.md` (116), but nothing matches
        the `.migrated` suffix that the .session-notes -> .session-notes.d/ migration produces. The
        leftover file's own opening lines declare it "Local-only by design" and it carries the root
        forest ledger, traps, and cross-repo receipt pointers.
      instance_b: >-
        `.wave-tracker.d/` is NOT ignored, while its sibling `.session-notes.d/` IS (line 115).
        `commands/wrapup.md` § Wave tracker places per-operator wave DETAIL at
        `.wave-tracker.d/<display_id>.md`, i.e. exactly the same class of local state, so the
        omission looks like an oversight when `.session-notes.d/` was added rather than a decision.
      evidence: >-
        `git check-ignore -q` exit codes with controls on BOTH poles: `.session-notes.d/<id>.md`
        exits 0 (known-ignored control) and README.md exits 1 (known-not-ignored control), so the
        instrument discriminates here. Against that, `.session-notes.migrated` exits 1 and
        `.wave-tracker.d/<id>.md` exits 1 — both NOT ignored.
      why_it_matters: >-
        Committing either is a sensitivity/classification escalation in the
        recommendation-quality.md MUST-8 sense: per-operator local state — material that SHOULD be
        gitignored but is not, which is the whole finding — moving onto a committed, all-operator
        surface. It is mechanically cheap (an ordinary local commit), which is precisely why no
        action-mechanics gate catches it.
      why_the_fix_belongs_upstream: >-
        CASCADE, not impossibility — an earlier draft claimed "NOT locally fixable" and that was
        wrong. The managed block spans lines 79-123, but the pre-block region (1-78) is editable
        and persists across syncs: line 56's `**/.session-notes` is a repo-local entry present in
        NEITHER manifest key, and it has survived every sync alongside the managed block. So a
        local fix WOULD work here — it would simply reach this one repo. The manifest fix is
        preferred because it cascades to 30+ consumers, not because a local edit is blocked.
        Stated precisely so a Gate-1 reviewer is not handed a false structural fact.
      requested_fix: >-
        Add `.session-notes.migrated` (or a `.session-notes*` form covering the migration suffix)
        and `.wave-tracker.d/` to `sync-manifest.yaml § visibility_gitignore_additions.public` —
        NOT to `gitignore_additions`. The key choice is load-bearing, not cosmetic: all three
        siblings this item cites as precedent (`.session-notes`, `.session-notes.d/`,
        `.session-notes.shared.md`) live in `visibility_gitignore_additions.public` and NONE is in
        `gitignore_additions`. The manifest states that `gitignore_additions` "controls what the
        consumer's own git tracks" for ALL consumers, whereas private/team consumers deliberately
        do NOT receive the visibility entries because they TRACK session-notes as shared team
        institutional knowledge, mirroring loom itself. Routing this through `gitignore_additions`
        would therefore ignore per-operator state on precisely the consumers that intend to track
        it — diverging from the sibling policy this item invokes as its own precedent.
      opt_out_group_assignment_needed: >-
        ONE THING THIS REPO CANNOT SETTLE, flagged so it is decided rather than defaulted. The
        manifest documents opt-out granularity as named groups (`visibility_opt_out:
        [session-notes|workspaces]`). `.session-notes.migrated` sits cleanly in the `session-notes`
        group. `.wave-tracker.d/` belongs to NEITHER named group. If the applier maps opt-out
        tokens to literal path sets, adding `.wave-tracker.d/` to `.public` without assigning it a
        group would leave it un-opt-out-able for a private/team consumer that wants to keep
        tracking it — reintroducing, for that path, the same all-consumer-scope problem the key
        re-routing exists to avoid. loom should assign the group explicitly (extend
        `session-notes`, or mint a `wave-tracker` token). UNVERIFIABLE-HERE: `sync-tier-aware.mjs`
        is `loom_only` and absent from this repo, so the applier's actual mapping cannot be read
        from a consumer clone.
      scope_audit: >-
        The "are there others?" question was answered here rather than left to loom. Enumerating
        every untracked-and-not-ignored path in the whole repo returns EXACTLY these two and
        nothing else, so the gap is bounded at two entries — this is not the visible tip of a
        wider class. Every other root dotfile and dot-directory is either correctly ignored
        (`.env`, `.session-notes.d/`, `.session-notes.shared.md`) or legitimately tracked
        (`.claude/`, `.codex/`, `.gemini/`, `.github/`, `.devcontainer/`). Control: README.md
        resolves NOT-ignored as expected, so the check discriminates. loom should still apply the
