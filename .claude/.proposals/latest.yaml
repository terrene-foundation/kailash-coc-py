status: pending_review

# ----------------------------------------------------------------------------
# Loom-side manifest directives proposed (Gate-1 reviewer enacts in
# sync-manifest.yaml; extension beyond strict Step 7b schema, human-reviewed).
# ----------------------------------------------------------------------------

manifest_directives_proposed:
  # Files that the operator authors per-project; /sync MUST NOT overwrite them.
  preserve_globs:
    - "Dockerfile.user" # operator's per-project image overlay
    - "compose.override.yml" # operator's per-project service overlay
    - ".devcontainer/postCreate.user.sh" # operator's per-project bootstrap (template ships .example sibling)
    - ".devcontainer/devcontainer.user.json" # operator's per-project VS Code overlay
    - "*-user.*" # generic per-project suffix family
    - "*.user.*" # generic per-project infix family
    - "package.json" # root package.json (consumer projects may carry one)
    - "package-lock.json" # ditto, lockfile companion
    - "yarn.lock" # ditto, yarn variant
    - "pnpm-lock.yaml" # ditto, pnpm variant

  # Tier subscription: dev-container scaffold lands in `coc` tier (Kailash-aware
  # subset). Consumers that subscribe to `coc` (per repos.<target>.tier_subscriptions)
  # get the eight files above on next /sync. The `base` tier (non-Kailash USE
  # templates) does NOT subscribe — dev-container is Kailash-substrate-specific.
  tier_subscription: coc

  # Gate-1 verification suggested by originator (loom's call):
  #   - G1 test: take a USE template, drop in a Dockerfile.user + compose.override.yml,
  #     run /sync, confirm both files survive untouched. This validates the
  #     preserve-glob set behaves per F4 brief.
  #   - G2 test: confirm the eight template-owned files are regenerated on /sync
  #     against an artificially divergent target (sibling to existing global/variant
  #     overlay tests).

