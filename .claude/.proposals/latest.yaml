        THIS PROPOSAL IS THE SECOND CONCRETE INSTANCE. The first was the relayed
        capability_request above (a downstream consumer hitting it at 7c); this block is a
        USE-template hitting the same wall at 7b, and improvising the same kind of extension.
        Two independent improvisations of different shapes is exactly the outcome that
        defeats mechanical Gate-1 triage.
      requested_fix: >-
