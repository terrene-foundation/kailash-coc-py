    cross_repo_boundary: >-
      No agent read loom. Anything settleable only at loom is labelled
      UNVERIFIABLE-HERE below and is NOT asserted as present fact.

  # ---- Cluster A — emitter completeness (the highest-value cluster) ----------
  # Items 9 and 1 are two MECHANISMS of one failure: an artifact reaches no lane
  # and nothing says so. ONE fail-closed "reaches no lane" assertion closes both,
  # and is the same guard the relayed capability_request above asks for in its
  # third acceptance criterion. Mark this cluster PRIORITY so a partial accept
  # still lands the structural fix.
  priority_cluster: A

  items:
    - id: 9
      cluster: A
      status: confirmed-as-filed
      where: ".claude/sync-manifest.yaml (variant_only:), .claude/bin/emit-cli-artifacts.mjs"
      finding: >-
        A `variant_only` artifact is applied by the sync overlay while bypassing
        the per-CLI emitter, so it reaches Claude Code and no other lane, with no
        exclusion declared anywhere. `agents/frameworks/infrastructure-specialist.md`
        is the instance: present at .claude/agents/frameworks/, absent from
        .gemini/agents/ (which holds 22 files), and declared under `variant_only: py`.
        It is a real specialist with a full tool list, not a stub.
      evidence: >-
        Zero occurrences in either CLI's cli_emit_exclusions block; also zero in
        emit-cli-artifacts.mjs::GEMINI_AGENT_STRUCTURAL_EXCLUSIONS, whose five entries are
        agents/codex-architect.md, agents/gemini-architect.md, agents/cli-orchestrator.md,
        agents/management/** and agents/_README.md. (Note for anyone cross-checking: the
        first entry is codex-architect, NOT cc-architect — cc-architect heads the separate
        SIX-entry CODEX constant. An earlier draft conflated the two lists.) Of the 9 files
        in .claude/agents/frameworks/, 8 have a .gemini/agents/ counterpart and 8 have a
        .codex/prompts/specialist-*.md counterpart; infrastructure-specialist is the sole
        omission on each. Control: dataflow-specialist resolves on BOTH non-CC lanes, so the
        empty infrastructure result is a true negative, not a dead matcher.
      both_non_cc_lanes_confirmed: >-
        #55's original wording — "absent from BOTH non-CC lanes" — is CORRECT and stands.
        An intermediate draft of this proposal wrongly downgraded it to a gemini-only finding
        on the premise that `.codex/` has no agents directory. That premise is true but
        IRRELEVANT: codex emits agents as `prompts/specialist-<name>.md`, not as an agents/
        directory (emit-cli-artifacts.mjs::emitCodexAgentPrompts materializes each eligible
        .claude/agents/<group>/<name>.md into .codex/prompts/specialist-<name>.md). Both
        non-CC lanes carry 22 agents each, and `infrastructure-specialist` is the SOLE absence
        on EACH. Control: a matcher for `dataflow` returns `specialist-dataflow.md`, so the
        empty `infrastructure` result on the codex lane is a true negative, not a dead matcher.
        The downgrade was caught by an adversarial review before this proposal left the repo.
      conflicts_with_declared_behaviour: >-
        CLAUDE.md states that specialist agents including `agents/frameworks/*` emit to
        .gemini/agents/<name>.md for Gemini's @<agent> invocation. The drop therefore
        contradicts a documented promise.
      unverifiable_here: >-
        Whether loom's own emitter declares an exclusion for this file. Emission runs at
        loom; no cross-repo read was authorized. Only "nothing in the CONSUMER tree
        declares it" is asserted.
      requested_fix: >-
        Feed variant_only artifacts into the per-CLI emitter's corpus so a variant-supplied
        specialist emits on every lane its class declares — OR declare them excluded, in
        which case CLAUDE.md's `agents/frameworks/*` claim needs qualifying.

    - id: 1
      cluster: A
      status: changed-premise-corrected
      where: ".claude/agents/codex-architect.md"
      original_claim: "still teaches dead /prompts: invocations, count 2"
      finding: >-
        The COUNT is right and the CHARACTERIZATION is wrong. Both hits (lines 26 and 50)
        are DESCRIPTIVE references to the deprecated `/prompts:<phase>` surface, and each
        already names `bin/coc` as the replacement in the same sentence. Line 174 is an
