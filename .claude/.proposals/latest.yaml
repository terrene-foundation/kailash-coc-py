  decision_for_the_human_not_a_defect:
    id: S3-D1
    title: use_softenings applies to ONE of FOUR output surfaces -- is that intended?
    evidence_class: VERIFIED-BY-ORCHESTRATOR
    finding: >-
      The CC rule tree is SOFTENED for downstream consumers ("guidelines you may relax with intent",
      "Recommended for downstream") while EVERY OTHER OUTPUT SURFACE carries the older, STRICTER text
      ("ABSOLUTE and NON-NEGOTIABLE", "MUST gates"). Net effect: in this repo, operators on any
      non-CC surface are governed by materially stricter rules than CC operators.

      MEASURED across all four surfaces, matcher controlled to fire on each file:
      .claude/rules -> "ALL sessions, ALL agents, ALL PRODUCTION code" + "Quality Gates (Recommended
      for downstream)" = SOFTENED. The Codex baseline, the Gemini baseline, and .coc/rules ALL ->
      "ALL sessions, ALL agents, ALL CODE" + "Quality Gates (MUST -- Gate-Level Review)" = STRICT.

      So the split is ONE softened surface against THREE strict ones -- not, as an earlier draft of
      this block said, "one of three". The correction matters for the disposition rather than being
      cosmetic: three INDEPENDENT output surfaces agree on the strict text and only the CC tree
      diverges. A deliberate per-lane variant would be expected to be lane-aware; a single diverging
      surface against three agreeing ones is the shape of a transform applied at one point in the
      pipeline, which is what the manifest describes.

      This was ORIGINALLY filed as "the softening never propagated", implying an oversight. That
      framing was WRONG and is withdrawn. The mechanism is sync-manifest.yaml::use_softenings -- a
      deliberate, extensively documented USE-lane find/replace transform carrying an explicit
      guardrail: soften the FRAMING, preserve the GUIDANCE, and leave safety substance strict
      ("never relax a real safety gate's substance"). So the divergence is a transform applied to the
      CC tree that the baselines, generated from pre-softening source, never receive.
    why_this_is_a_decision_and_not_a_bug: >-
      The counter could not be defeated: the un-softened baselines are arguably FAIL-SAFE. The two
      non-CC lanes receive the STRICTER posture, which is the conservative direction. This is only a
      defect if cross-CLI uniformity is the goal. The manifest's own rationale for softening ("users
      choose their own workflow") is CLI-agnostic, which argues the divergence is not an intended
      per-lane variant -- but that is an inference about intent, not evidence of one.

      Unlike every finding above, this does NOT regenerate away. Regenerating the baselines from
      current source would either propagate the softening to all three lanes or leave the divergence
      standing, depending on where in the pipeline the transform sits. That is the decision.
    requested_disposition: >-
      Ratify or reject: should use_softenings apply to ALL USE-lane output surfaces, or is the
      stricter non-CC posture intended? No code change is requested until that is answered.

  reattributed_do_not_read_as_a_container_finding:
    id: S3-R1
    title: The hook depth-coverage figure is NOT a container property
    finding: >-
      Container-side hook execution WAS exercised this session, closing the preceding block's
      "never exercised" gap. Of 40 hooks run against 12 canonical event payloads on both sides
      (480 pairs per side), 2 hooks diverge -- see S3-9. Separately, only 13 of 40 hooks exercised
      substantive logic; the rest returned bare passthrough.

      That depth figure was initially presented in a container-parity frame. The measuring lane
      then SETTLED it against its own captures and WITHDREW that framing: host and container show
      IDENTICAL SETS -- not merely identical counts -- 13 substantive, 25 passthrough-only, 2 silent,
      with ZERO hooks substantive on one side only. It measures the same on the development host.
    correct_framing_for_any_downstream_use: >-
      "Depth coverage was 13 of 40 hooks exercising substantive logic -- identical on host and
      container -- reflecting the synthetic payload set and this repo's coordination-disabled
      configuration, not any container property."
    mechanism_now_largely_RESOLVED_and_the_FIGURE_CORRECTED: >-
      A dedicated per-hook trigger analysis has since classified 18 of the 20 in the target set
      (90%) and CORRECTS the depth figure UPWARD. Both the original and the correction are recorded,
      because the correction came from a DIFFERENT INSTRUMENT rather than a re-judgment of the same
      evidence -- which is the part worth carrying.

      THE FIGURE IS 16 OF 40, NOT 13. Three hooks DID fire during the baseline sweep and were scored
      bare: they do their work as a FILESYSTEM SIDE EFFECT and emit exactly {"continue":true}. A
      stdout/stderr classifier -- BOTH lanes' -- structurally cannot see them. Proven empirically:
      two provenance-capture hooks wrote real ledger rows DURING the 520-run baseline (rows quoted
      with timestamps inside the sweep window), and a heartbeat hook was proven with BOTH POLES --
      identity injected but the signing-key env var unset produced NO log append, while the targeted
      run produced a 174-byte append -- with stdout {"continue":true} in BOTH cases.

      Orchestrator corroboration: all three are REGISTERED in settings.json (so they do fire), the
      capture hooks reach a `captureProvenance` write path, and the provenance ledger directory
      exists on disk. Recorded honestly: the orchestrator's FIRST corroboration attempt used a
      too-narrow write-call matcher and returned zero -- an artifact of the matcher, not evidence of
      no write. Same instrument-class error this proposal documents elsewhere, caught by widening
      the matcher rather than by trusting the zero.

      Under TARGETED payloads, 23 of 40 are demonstrably capable of substantive logic in this
      template (13 baseline + 3 side-effect + 7 payload-set-limitation proven individually, each
      with a falsifier that stayed bare). So the low baseline number reflects the SYNTHETIC PAYLOAD
      SET far more than any property of the environment.

      The two hooks that did not fire even when targeted are BOTH payload-set limitation, neither
      inert: one matches raw library IMPORT statements rather than raw SQL (the targeted payload was
      simply in the wrong class -- a framework import fires it), and the other is a strip-fence that
      refuses only when the RESULT of an edit is under-protected -- it fired with a deny decision
      when given an edit that removes a trust-posture deny line.

      Coordination-disabled remains the explanation for at most 7 (lexical proxy), and those 7 were
      NOT re-examined. Two hooks remain Not-Run and one Retest (a second gate never reached).

  findings_shipped_but_unwireable:
    - id: S3-10
      title: Two shipped hooks CANNOT FIRE, and both sit on the downstream delete-list
      evidence_class: VERIFIED-BY-ORCHESTRATOR
      severity: MEDIUM
      finding: >-
        `hooks/coc-drift-warn.js` and `hooks/coc-telemetry-autocommit.js` ship in this template but
        are wired to no event and cannot fire under any input. Three independent facts, each
        verified by the orchestrator with a control:

        (a) ZERO registrations in `.claude/settings.json` for either. Control: a registered hook
        returns 5 registrations, so the settings matcher fires.

        (b) BOTH are listed in `.claude/.coc-obsoleted` -- the delete-list a consumer sync reads to
        REMOVE downstream artifacts. They are simultaneously shipped and marked for deletion.

        (c) NEITHER carries an `@settings-registration:` header marker. Control: an unregistered
        hook that IS reachable by another surface carries the marker (returns 1), so the marker
        matcher discriminates unregistered-BY-DESIGN from genuinely unwireable.

        Distinction (c) draws is the load-bearing one. THREE other unregistered hooks are
        unregistered by design and each documents its alternate surface -- one is installed as a git
        hook, two are opt-in for a consumer to register in its own settings. Those are correctly
        absent. These two document nothing and have no surface.
      why_it_matters: >-
        The sharper half is (b), which points at a SYNC-APPLICATION gap rather than a hook-design
        gap: a path on the obsoleted delete-list is still present in the shipped tree. Whether the
        tier machinery failed to apply the deletion, or the deletion was never propagated, is NOT
        determinable from a consumer clone -- the emitter is upstream. Reported as the observed
        asymmetry, not as a confirmed emitter bug.
      requested_fix: >-
        Delete both from the shipped set -- they are already on the list that says so -- or, if
        either is meant to remain reachable, register it or give it an `@settings-registration`
        marker naming its surface, as the three by-design-unregistered hooks do.

  findings_broken_section_anchors:
    - id: S3-11
      title: An extraction left 11 load-bearing citations pointing at clauses that no longer exist
      evidence_class: VERIFIED-BY-ORCHESTRATOR
      severity: MEDIUM
      finding: >-
        SIXTEEN broken section anchors -- a citation whose FILE resolves but whose named SECTION is
        gone. This is worse than a fully-broken reference: the path resolves, so the pointer looks
        live, a reader follows it, and finds nothing. The preceding block named this class as
        unaudited ("a link may resolve to a real file whose named section is gone"); this closes it.

        THIRTEEN of the sixteen are ONE cluster with ONE root cause. A 2026-06-12 extraction moved
        the worktree MUST-clauses OUT of `rules/agents.md` and INTO
        `skills/30-claude-code-patterns/worktree-orchestration.md`, where they were re-hosted under
        new names ("Rule 1 --", "Rule 2 --", ...). The rule now carries only a delegating section.
        Every back-reference was left pointing at clause names that no longer exist at the cited
        path -- including six in the extraction's OWN destination file.

        These are the corpus's most load-bearing citation shape, not passing mentions. Example
        verbatim: `**Rule:** rules/agents.md § "MUST: Worktree Isolation for Compiling Agents".`
        An agent following that pointer to find the governing clause finds nothing.

        THREE more are wrong-file citations (a clause attributed to one rule that lives in another,
        and one whose named section exists nowhere in the corpus), and TWO are singletons pointing
        at named sections absent from an existing file.
      verification: >-
        Orchestrator re-derived the cluster's root cause with a firing control: each cited clause
        name returns ZERO occurrences in the cited file, while a section that IS present in that
        file returns 1 -- so the matcher discriminates rather than silently failing. The clauses were
        confirmed present in the extraction's destination under their new names, and the
        `**Rule:**` citation shape was read verbatim at its source line.
      why_it_is_hard_to_see: >-
        Nothing detects this class. A file-existence sweep passes (the file is there); a link checker
        that stops at the path passes; and the citation reads as authoritative because the corpus
        uses `**Rule:**` pointers precisely for its load-bearing cross-references. Several rules
        MANDATE grep-stable anchors so citations survive edits -- this is what it looks like when an
        extraction moves the target without updating the anchors.
      honest_bound_from_the_reporting_lane: >-
        SIXTEEN IS A FLOOR, NOT A CEILING, and the lane stated why against its own number: its
        resolver accepts a citation whenever a real heading CONTAINS the cited span, so a rename
        that preserves the cited keyword resolves OK and is missed. Three such cases were found and
        deliberately EXCLUDED from the sixteen (the section is still findable), and they are the
        visible edge of that class. Coverage was 100% of the population it defined -- 466 citations,
        all 151 non-resolving cases read individually -- with pass-rate reported separately at 96.6%.
      requested_fix: >-
        Repoint the 11 cluster citations at the extraction's destination and its new clause names;
        correct the 3 wrong-file citations; resolve the 2 singletons. More durably: any extraction
        that moves a clause between artifacts MUST sweep and repoint inbound anchors in the same
        change -- the extraction here updated the content and left every pointer behind.

  findings_container_parity:
    - id: S3-9
      title: Brief Scope 6 is NOT met -- 2 of 40 hooks diverge, on credential and identity passthrough
      evidence_class: LANE-REPORTED, key facts VERIFIED-BY-ORCHESTRATOR
      severity: MEDIUM
      finding: >-
        Two hooks behave differently inside the container. A session-start hook reports the open-PR
        queue as NOT VERIFIED on all 12 events, because the GitHub CLI is present and the network
        reachable but the session is unauthenticated. A multi-operator session-start hook falls back
        to a solo identity with a null verified id on 9 of 12 events, because no git identity and no
        signing keyring reach the container.

        Both are HOST-ENVIRONMENT INPUTS the container never receives, not hook code defects, and
        both FAIL SAFE: one emits a loud explicit warning, the other falls back to a documented
        unrostered identity at the lowest trust posture. Neither crashes. The runtime major-version
        delta between host and container was tested and produced NO divergence -- it is not the cause.
      verified_by_orchestrator: >-
        The 40-hook denominator; the absence of any GitHub token variable from .env.example; the
        image tag pinned consistently across the consumer-shipped files.
      a_concern_raised_and_then_REFUTED_at_the_sink: >-
        Recorded because the refutation is more valuable than the original concern. The orchestrator
        asked whether the degraded identity could permit an UN-ATTRIBUTABLE coordination write, which
        would be far more serious than a cosmetic banner. It cannot, for a structural reason: the
        shared append helper requires a non-empty verified id AND a non-empty person id and returns a
        typed failure BEFORE any write, and the solo identity sets person id to null
        UNCONDITIONALLY -- so even a branch carrying a real key fingerprint still fails the guard.
        The failure mode is NO RECORD, never a mis-attributed one.

        A follow-on sweep then confirmed both call sites INSPECT that failure and fall through to a
        write that PRESERVES the row marked as unrostered, so a degraded identity yields an auditable
        row rather than a silent undercount. The one discarded return in the chain is documented
        best-effort on a telemetry file that feeds no posture arithmetic (0 mentions in the posture
        rule; the violations file is named twice).
      requested_fix: >-
        Document the credential and identity passthrough path for the container, or add the token to
        .env.example. The image itself is sound -- every hook loads and runs, no crashes, no timeouts.

