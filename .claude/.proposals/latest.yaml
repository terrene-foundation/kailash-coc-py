use_template_findings_multi_cli_audit:
  source_repo: kailash-coc-py
  origin: use-template
  codify_date: 2026-08-07
  codify_session: >-
    Systematic three-lane parity + dangling-reference + hook-executability audit of the
    shipped template. Closes the discovery half of brief Scope 1 (multi-CLI delivery),
    which prior passes had only spot-checked from /sweep findings. Four fixes landed
    locally this session (PRs 61-64); everything below is loom-side and cannot be
    durably fixed at a consumer.
  filed_as: >-
    NOT filed as a GitHub issue. Raised directly here because every item targets a
    loom-emitted artifact or the emitter itself.
  method: >-
    Four parallel read-only lanes. Every lane was required to name a falsifying result
    before citing any check, and to fire each matcher at a known-positive first. Three
    lanes caught and discarded a defect in their OWN instrument before reporting -- one
    resolver reported non-existent modules as resolving and would have returned a clean
    sweep; a differential ignore-check failed its own probe control; an anchored grep
    returned zero regardless of the answer because the tool indents its output.

  clusters:
    A: emitter completeness -- artifacts or rules that reach some CLI lanes and not others
    B: shipped-but-unrunnable -- artifacts distributed to consumers that cannot execute here
    C: silent failure -- code that reports success it did not achieve
    D: distribution mismatch -- what ships disagrees with what the manifest declares

  items:
    - id: A1
      cluster: A
      status: VERIFIED-BY-ORCHESTRATOR
      severity: HIGH
      where: .claude/rules/burn-down-reporting.md
      finding: >-
        An entire rule reaches the CC lane ONLY. It has zero presence in AGENTS.md, GEMINI.md,
        .codex/ and .gemini/, and is not mentioned anywhere in sync-manifest.yaml -- so the
        absence is undeclared, not a scoping decision. The rule declares
        cli_delivery: skill-channel, meaning it EXPECTS delivery through the rules-reference
        index, which is the non-CC lanes' only channel for a path-scoped rule.
      evidence: >-
        grep across AGENTS.md, GEMINI.md, .codex and .gemini returns ZERO hits, while the same
        command for a skill-channel sibling (product-completion-first) returns hits in AGENTS.md,
        GEMINI.md and .codex/ -- so the matcher fires here and the zero is a true negative.
        sync-manifest.yaml mentions the rule 0 times against 3 for the same sibling. Of the seven
        rules declaring cli_delivery: skill-channel, six are indexed and this one alone is not.
        Its sort slot is demonstrably empty: the index is title-sorted and runs BUILD... directly
        into CI..., with no Burn-Down row between them.
      why_it_matters: >-
        Codex and Gemini operators never receive the session/wave close-out reporting contract.
        Their wave gates and wrapups run unconstrained while CC enforces it -- a silent
        cross-CLI divergence in what "done" means.
      requested_fix: >-
        Index burn-down-reporting.md into the rules-reference skill for both non-CC lanes, OR
        declare the exclusion explicitly in cli_emit_exclusions. Either is acceptable; silence
        is not.
      systemic_question: >-
        Six of seven indexed and one missed suggests the indexer is not driven by the
        cli_delivery declaration itself. Worth checking whether the index is generated from a
        list that must be hand-extended -- if so, every future skill-channel rule inherits this.

    - id: A2
      cluster: A
      status: LANE-REPORTED
      severity: HIGH
      where: .codex/ (33 citing lines / 30 files), .gemini/ (29 lines / 28 files)
      finding: >-
        The emitter rewrites agent citation paths into the target namespace but emits agents
        under a DIFFERENT layout, so the rewritten citations resolve to nothing. .codex/agents/
        does not exist at all (agents ship as .codex/prompts/specialist-<stem>.md); .gemini
        emits agents FLAT while citations retain the CC frameworks/ and implementation/ nesting.
      why_it_matters: >-
        The specialist delegation graph is broken on both non-CC lanes and intact on CC. Any
        operator following a cross-reference lands on a non-existent path.
      requested_fix: >-
        Rewrite agent citations to the emitted layout per lane, or emit agents at the cited
        layout. The counts are LOWER BOUNDS -- the lane matched backticked/bare paths only.

    - id: A3
      cluster: A
      status: LANE-REPORTED
      severity: MEDIUM
      where: .gemini/ -- 11 lines / 8 files / 7 distinct targets
      finding: >-
        Citations point at .gemini/commands/<name>.md while Gemini commands are emitted as
        .toml. The emitter rewrote the directory segment but not the extension.
      why_it_matters: >-
        The affected targets are the enrollment and onboarding ceremonies -- the first paths a
        NEW Gemini operator walks.
      requested_fix: Rewrite the extension alongside the directory segment for the gemini lane.

    - id: A4
      cluster: A
      status: LANE-REPORTED
      severity: MEDIUM
      where: skills/management/release-checklist.md
      finding: >-
        Cited by the release command on all three lanes, but the file is variant_only.py, and
        variant_only additions land on the CC lane only. It resolves on CC and dangles on the
        other two. This RE-OPENS a DANGLEREF the manifest itself records as closed -- the
        closure note claims the citation now resolves at the deployed template, which is true
        for exactly one of three lanes.
      requested_fix: >-
        Emit the file to all three lanes, or make the citation lane-conditional. Also correct
        the manifest closure note, which currently overstates the repair.

    - id: A5
      cluster: A
      status: LANE-REPORTED
      severity: MEDIUM
      where: .codex/prompts/specialist-reviewer.md, .gemini/agents/reviewer.md
      finding: >-
        Both non-CC reviewer agents are instructed to read a skill inside a tree that
        cli_emit_exclusions DECLARES excluded for those lanes, so the target structurally
