    They were accepted by the repo owner on 2026-08-05 as a logged bet, and a later session RESOLVED
    all four rather than re-accepting them. Their status is therefore CLOSED, not deferred, and the
    residual carries nothing forward. This entry exists to discharge the trigger explicitly and to
