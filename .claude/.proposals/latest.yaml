        (narrower than 7c's `created | modified | obsolete`).
      why_route_b_does_not_close_it: >-
        A capability/bug lane does exist (sync-flow.md § "Route-B Capability/Bug Upflow"),
        but it produces a human-gated BUILD issue draft rather than a proposal-manifest
