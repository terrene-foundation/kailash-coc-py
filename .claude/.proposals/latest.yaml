    - "[ ] S4-9: both citing lines pass the shape guard, or the guard is paragraph-scoped."
    - "[ ] S4-11: the pattern-expert citation resolves from its own directory; both the backtick and md-link halves are corrected."
    - "[ ] S4-12: the eight phantom security-skill bullets are removed or the files authored."
    - "[ ] S4-13: the state-file detector resolves write targets, or its lexical layers no longer carry block."
    - "[ ] S4-16: each of the four A-prime tokens is dispositioned against loom's ALWAYS_INCLUDE."
    - "[ ] S4-17: .claude/guides is in DEFAULT_SCOPE_DIRS, and the findings it surfaces in the backtick and md-link classes are dispositioned rather than deferred."
