    it was surfaced during this verification pass and has no issue of its own.

  verification:
    method: >-
      Three independent read-only agents re-derived every factual claim against
      the tree at main @ 8d2705d on 2026-08-05, each required to name the
      falsifying result it looked for and to fire a control proving its matcher
      discriminates in this repo (instrument-discipline.md MUST-1 + MUST-3).
    outcome: >-
      Of #55's 9 filed items: 6 CONFIRMED (item 9 exactly as filed; item 5 with its schema
      scope corrected), 2 CHANGED (premise corrected — items 1 and 4), 1 REFUTED and WITHDRAWN
      (item 8). Item 10 was newly surfaced during the pass and is CONFIRMED. Three of the nine
      filed items were materially wrong as filed; had this proposal been written from the issue
      text it would have carried false claims to Gate-1 and, once split, to every consumer.
    second_round: >-
      An adversarial review of THIS block then found that the block itself had introduced a new
      error in the opposite direction: it had downgraded item 9 (a TRUE claim) to a single-lane
      finding on a false premise about how codex emits agents. That downgrade is reverted above
      and item 9 now agrees with #55. Further corrections from the same and subsequent rounds are
      also applied: item 10's fix RE-ROUTED from `gitignore_additions` to
      `visibility_gitignore_additions.public` (the single most consequential remedy correction —
      the original key's all-consumer scope would have ignored per-operator state on precisely the
      private/team consumers that deliberately track it); the item-4 fix-mechanism (it would have
      rendered BEFORE the negation and silently done nothing); the item-4 materialized-vs-latent
      framing; the item-2 disclosure dimension; the item-2 purge attribution (over-corrected once,
      then fixed — `use_obsoleted` also covers the USE lane); two miscited constants; a `-v`
