        The two forms rescue against DIFFERENT consumer ignore shapes: against a file-glob
        ignore (`*.json`) only `/**` rescues the fixtures; against a directory-form ignore
        (`audit-fixtures/`) only the trailing slash does. The `/**` is load-bearing.

